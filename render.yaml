# =============================================================================
# Render Blueprint — AZM backend
#
# VERIFIED LIVE STATE, checked 2026-11-17 12:56 UTC against the Render API
# (service "AZM-backend", srv-da1pvvrncjis73fru9fg, Frankfurt):
#
#   plan            : free
#   autoDeploy      : no  (autoDeployTrigger: off — deploys are manual)
#   branch          : main
#   buildCommand    : npm install && npm run build && npm run release
#   preDeployCommand: NOT EXECUTED on the Free plan
#   startCommand    : node index.js
#   live commit     : 48c17ab10248 (deployed 2026-10-15T16:59:51Z)
#
# This file now mirrors those values. Before 2026-11-17 it declared
# `plan: starter`, `preDeployCommand: npm run release` and `autoDeploy: true`,
# so the repository and the live service disagreed about the one thing that
# matters: WHERE the schema installers run. On Free, Render does not run a
# Pre-Deploy Command, so `npm run release` never executed on deploy.
#
# WHY THE FULL CHAIN RUNS IN BUILD: the release chain is the only sanctioned
# production DDL path, and a Build Command runs to completion BEFORE the new
# version receives traffic — the same barrier Pre-Deploy would provide. The
# chain must be the whole thing (31 installers, dependency-ordered, authority
# verification last). Do not replace it with a hand-picked subset: the
# installers have ordering and coverage dependencies, and
# `infra/verify-authority-boundary.js` is a required final gate.
#
# WHY THE GUARD COMES FIRST: `npm run release` begins with
# `infra/verify-release-target.js`, which refuses to run when the context is a
# pull-request preview, a non-main branch, or a local/private database target.
# Production DDL can therefore never be applied by an untrusted build.
#
# SCHEMA AUTHORITY: production schema changes are deployed EXCLUSIVELY by the
# `infra/install-*` raw-SQL installers. `prisma migrate deploy` is not part of
# any deploy path and production intentionally has no `_prisma_migrations`
# table. Never add a `prisma/migrations` file for an invariant an installer
# owns: the installers are the single source of truth for production DDL.
#
# Every installer is idempotent, so re-running the release step is safe.
#
# NOTE ON IDENTITY: the live service is named "AZM-backend". The `name` below
# is historical. Do not "sync" this blueprint into Render blindly — it would
# propose creating a differently-named service. Treat it as documentation of
# the live configuration, not as a provisioning source.
# =============================================================================
services:
  - type: web
    name: azaman-backend
    runtime: node
    plan: free
    branch: main
    # Full release chain, after the build, before traffic. See above.
    buildCommand: npm install && npm run build && npm run release
    # Deliberately absent: `preDeployCommand`. The Free plan does not execute
    # it, and declaring it here is what made the repo disagree with reality.
    # If this service ever moves to a paid plan, put `npm run release` in
    # preDeployCommand and drop it from buildCommand — never both.
    startCommand: node index.js
    healthCheckPath: /health
    # Deploys are manual: nothing reaches production just because main moved.
    autoDeploy: false
    envVars:
      # CI (.github/workflows/test.yml), .nvmrc and package.json engines all
      # pin Node 24 — the only major version the full serial test battery has
      # been verified against.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # CORS allow-list — update when new frontend origins are added
      - key: CORS_ORIGINS
        value: "https://azm-admin-portal.vercel.app,https://azm-business-portal.vercel.app,https://azaman.me,https://www.azaman.me"
      # DATABASE_URL and all secrets remain managed in the Render dashboard /
      # environment group — they are intentionally NOT committed here.
