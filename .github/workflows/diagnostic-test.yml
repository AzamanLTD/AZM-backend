name: Temporary Diagnostic Test Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma db push --accept-data-loss
      - run: node infra/install-transaction-quote-overlay.js
      - run: npx prisma generate
      - name: Capture Jest output
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --forceExit > /tmp/jest.log 2>&1
          code=$?
          cp /tmp/jest.log jest-failure.log
          echo "JEST_EXIT_CODE=$code" >> jest-failure.log
          exit 0
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-diagnostic-log
          path: jest-failure.log
          retention-days: 2
