name: POS Failure Diagnostics

on:
  push:
    branches: ['fix/business-os-pos-atomicity']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Apply database schema
        run: npx prisma db push --accept-data-loss
      - name: Install transaction quote overlay
        run: node infra/install-transaction-quote-overlay.js
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run POS-focused suite
        id: pos
        continue-on-error: true
        run: |
          set -o pipefail
          npm test -- --runInBand --forceExit __tests__/posOrderService.unit.test.js 2>&1 | tee pos-test-output.log
      - name: Run order contract probes
        id: probes
        continue-on-error: true
        run: |
          set -o pipefail
          npm test -- --runInBand --forceExit __tests__/business-order-stats.test.js __tests__/business-order-webhook-semantics.test.js 2>&1 | tee contract-probe-output.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-failure-diagnostics
          path: |
            pos-test-output.log
            contract-probe-output.log
          if-no-files-found: error
      - name: Preserve failure result
        if: steps.pos.outcome == 'failure' || steps.probes.outcome == 'failure'
        run: exit 1
