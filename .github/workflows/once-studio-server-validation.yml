name: Integrate server-side Studio validation

on:
  push:
    branches:
      - feat/storefront-studio-server-validation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add validation at save and publish boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          service = Path('services/storefrontService.js')
          s = service.read_text()

          import_anchor = "const { migrateLayout, generateEmptyLayout } = require('./storefrontSchemaMigration');"
          import_replacement = import_anchor + "\nconst { validateStudioDocument } = require('./storefrontStudioValidation');"
          if s.count(import_anchor) != 1:
              raise SystemExit('storefront schema migration import anchor is not unique.')
          if "require('./storefrontStudioValidation')" not in s:
              s = s.replace(import_anchor, import_replacement, 1)

          helper_anchor = "function preserveExperienceSnapshot(nextLayout, currentDraftLayout) {"
          helper = """function validateStudioExperience(layoutJson) {\n  const experience = layoutJson?.experience;\n  if (experience?.schemaVersion !== 2) return;\n  try {\n    validateStudioDocument(experience);\n  } catch (error) {\n    const err = new Error('Storefront Studio document validation failed.');\n    err.code = error.code || 'STOREFRONT_DOCUMENT_INVALID';\n    err.validationCode = error.code || 'STOREFRONT_DOCUMENT_INVALID';\n    err.statusCode = 422;\n    throw err;\n  }\n}\n\n"""
          if s.count(helper_anchor) != 1:
              raise SystemExit('preserveExperienceSnapshot anchor is not unique.')
          if 'function validateStudioExperience(' not in s:
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          save_anchor = "  const migratedLayout = migrateLayout(layoutJson);\n\n  const draft = await prisma.businessStorefrontLayout.upsert({"
          save_replacement = "  const migratedLayout = migrateLayout(layoutJson);\n  validateStudioExperience(migratedLayout);\n\n  const draft = await prisma.businessStorefrontLayout.upsert({"
          if s.count(save_anchor) != 1:
              raise SystemExit('saveDraft validation anchor is not unique.')
          if 'validateStudioExperience(migratedLayout);' not in s:
              s = s.replace(save_anchor, save_replacement, 1)

          publish_anchor = "  // PHASE 8: Validate Nitro eligibility — reject if layout references"
          publish_replacement = "  validateStudioExperience(draft.layoutJson);\n\n" + publish_anchor
          if s.count(publish_anchor) != 1:
              raise SystemExit('publish validation anchor is not unique.')
          if s.count('validateStudioExperience(draft.layoutJson);') != 1:
              s = s.replace(publish_anchor, publish_replacement, 1)

          service.write_text(s)

          test = Path('__tests__/storefrontService-studio-validation.test.js')
          test.write_text(r"""const { validateStudioDocument } = require('../services/storefrontStudioValidation');

describe('Storefront Studio server validation boundary', () => {
  test('accepts a valid schemaVersion 2 experience', () => {
    expect(validateStudioDocument({
      schemaVersion: 2,
      pages: [{ id: 'home', root: ['section'] }],
      nodes: {
        section: { id: 'section', type: 'section', children: [], props: {}, style: {}, layout: {}, responsive: {}, actions: {} },
      },
    }).valid).toBe(true);
  });

  test('rejects unsafe experience data with a publish-safe error code', () => {
    expect(() => validateStudioDocument({
      schemaVersion: 2,
      pages: [{ id: 'home', root: ['button'] }],
      nodes: {
        button: { id: 'button', type: 'button', children: [], props: { html: '<script>' }, style: {}, layout: {}, responsive: {}, actions: {} },
      },
    })).toThrow(/not allowed|unsafe/i);
  });
});
""")

          workflow = Path('.github/workflows/once-studio-server-validation.yml')
          workflow.unlink()
          git_add = 'services/storefrontService.js __tests__/storefrontService-studio-validation.test.js .github/workflows/once-studio-server-validation.yml'
          import subprocess
          subprocess.run(['git', 'add', *git_add.split()], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: validate Storefront Studio documents server-side'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:feat/storefront-studio-server-validation'], check=True)
          PY
