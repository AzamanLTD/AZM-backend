name: Studio server validation integration

on:
  push:
    branches:
      - feat/storefront-studio-server-validation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch storefront service and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -c "from pathlib import Path; p=Path('services/storefrontService.js'); s=p.read_text(); a=\"const { migrateLayout, generateEmptyLayout } = require('./storefrontSchemaMigration');\"; b=a+\"\\nconst { validateStudioDocument } = require('./storefrontStudioValidation');\"; assert s.count(a)==1; s=s if 'require(\\\"./storefrontStudioValidation\\\")' in s or \"require('./storefrontStudioValidation')\" in s else s.replace(a,b,1); a=\"function preserveExperienceSnapshot(nextLayout, currentDraftLayout) {\"; h=\"function validateStudioExperience(layoutJson) {\\n  const experience = layoutJson?.experience;\\n  if (experience?.schemaVersion !== 2) return;\\n  try { validateStudioDocument(experience); } catch (error) { const err = new Error('Storefront Studio document validation failed.'); err.code = error.code || 'STOREFRONT_DOCUMENT_INVALID'; err.validationCode = err.code; err.statusCode = 422; throw err; }\\n}\\n\\n\"; assert s.count(a)==1; s=s if 'function validateStudioExperience(' in s else s.replace(a,h+a,1); a=\"  const migratedLayout = migrateLayout(layoutJson);\\n\\n  const draft = await prisma.businessStorefrontLayout.upsert({\"; b=\"  const migratedLayout = migrateLayout(layoutJson);\\n  validateStudioExperience(migratedLayout);\\n\\n  const draft = await prisma.businessStorefrontLayout.upsert({\"; assert s.count(a)==1; s=s if 'validateStudioExperience(migratedLayout);' in s else s.replace(a,b,1); a=\"  // PHASE 8: Validate Nitro eligibility — reject if layout references\"; assert s.count(a)==1; s=s if 'validateStudioExperience(draft.layoutJson);' in s else s.replace(a,\"  validateStudioExperience(draft.layoutJson);\\n\\n\"+a,1); p.write_text(s)"
          cat > __tests__/storefrontService-studio-validation.test.js <<'EOF'
const { validateStudioDocument } = require('../services/storefrontStudioValidation');

describe('Storefront Studio server validation boundary', () => {
  test('accepts a valid schemaVersion 2 experience', () => {
    expect(validateStudioDocument({
      schemaVersion: 2,
      pages: [{ id: 'home', root: ['section'] }],
      nodes: { section: { id: 'section', type: 'section', children: [], props: {}, style: {}, layout: {}, responsive: {}, actions: {} } },
    }).valid).toBe(true);
  });
});
EOF
          rm -f .github/workflows/once-studio-server-validation.yml
          git add services/storefrontService.js __tests__/storefrontService-studio-validation.test.js .github/workflows/once-studio-server-validation.yml
          git diff --cached --check
          git commit -m 'feat: validate Studio documents at storefront boundaries'
          git push origin HEAD:feat/storefront-studio-server-validation
