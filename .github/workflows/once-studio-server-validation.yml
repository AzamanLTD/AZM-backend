name: Studio server validation integration

"on":
  push:
    branches:
      - feat/storefront-studio-server-validation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/storefrontService.js')
          s = p.read_text()
          anchor = "const { migrateLayout, generateEmptyLayout } = require('./storefrontSchemaMigration');"
          assert s.count(anchor) == 1
          if "require('./storefrontStudioValidation')" not in s:
              s = s.replace(anchor, anchor + "\nconst { validateStudioDocument } = require('./storefrontStudioValidation');", 1)
          anchor = "function preserveExperienceSnapshot(nextLayout, currentDraftLayout) {"
          assert s.count(anchor) == 1
          if 'function validateStudioExperience(' not in s:
              helper = '''function validateStudioExperience(layoutJson) {
            const experience = layoutJson?.experience;
            if (experience?.schemaVersion !== 2) return;
            try {
              validateStudioDocument(experience);
            } catch (error) {
              const err = new Error('Storefront Studio document validation failed.');
              err.code = error.code || 'STOREFRONT_DOCUMENT_INVALID';
              err.validationCode = err.code;
              err.statusCode = 422;
              throw err;
            }
          }

          '''
              s = s.replace(anchor, helper + anchor, 1)
          anchor = "  const migratedLayout = migrateLayout(layoutJson);\n\n  const draft = await prisma.businessStorefrontLayout.upsert({"
          assert s.count(anchor) == 1
          if 'validateStudioExperience(migratedLayout);' not in s:
              s = s.replace(anchor, "  const migratedLayout = migrateLayout(layoutJson);\n  validateStudioExperience(migratedLayout);\n\n  const draft = await prisma.businessStorefrontLayout.upsert({", 1)
          anchor = "  // PHASE 8: Validate Nitro eligibility — reject if layout references"
          assert s.count(anchor) == 1
          if 'validateStudioExperience(draft.layoutJson);' not in s:
              s = s.replace(anchor, "  validateStudioExperience(draft.layoutJson);\n\n" + anchor, 1)
          p.write_text(s)
          PY
          cat > __tests__/storefrontService-studio-validation.test.js <<'EOF'
          const { validateStudioDocument } = require('../services/storefrontStudioValidation');

          describe('Storefront Studio server validation boundary', () => {
            test('accepts a valid schemaVersion 2 experience', () => {
              expect(validateStudioDocument({
                schemaVersion: 2,
                pages: [{ id: 'home', root: ['section'] }],
                nodes: { section: { id: 'section', type: 'section', children: [], props: {}, style: {}, layout: {}, responsive: {}, actions: {} } },
              }).valid).toBe(true);
            });
          });
          EOF
          rm -f .github/workflows/once-studio-server-validation.yml
          git add services/storefrontService.js __tests__/storefrontService-studio-validation.test.js .github/workflows/once-studio-server-validation.yml
          git diff --cached --check
          git commit -m 'feat: validate Studio documents at storefront boundaries'
          git push origin HEAD:feat/storefront-studio-server-validation
