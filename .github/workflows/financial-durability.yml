# Financial-integrity durability lane (r15 audit item 10)
# =============================================================================
# The main test battery (test.yml) deliberately tunes its THROWAWAY Postgres
# with synchronous_commit=off: the TRUNCATE-heavy cleanup hooks make the
# 236-suite run ~10x slower otherwise, and a disposable CI database has no
# durability requirement. That is the right call for the fast lane.
#
# But it means the main lane does NOT rehearse the commit-durability behavior
# production PostgreSQL provides (fsync per commit, synchronous_commit=on) on
# the critical settlement/reconciliation/reversal paths. A settlement that
# only passes against a relaxed commit mode is not proven against the mode
# production actually runs.
#
# This lane is the focused rehearsal: the SAME suites that prove financial
# integrity, against a database in the PRODUCTION commit mode. The two lanes
# serve different purposes and must not be conflated:
#   - test.yml            → full battery, speed-optimized, relaxed commits
#   - financial-durability.yml → financial-integrity suites, production commits
#
# Lane invariants (guarded below, not just documented):
#   1. NO synchronous_commit tuning step in this lane.
#   2. An explicit guard step asserts synchronous_commit=on and FAILS the lane
#      if the setting has drifted — tuning added "temporarily" is caught here.
#   3. The suite list is explicit and financial-only; nothing else is run.
# =============================================================================
name: financial-durability

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: financial-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-durability:
    runs-on: ubuntu-latest
    # The focused financial battery is far smaller than the full one; a slow
    # runner still only needs a fraction of the main lane's 90-minute budget.
    timeout-minutes: 45

    # The database guard authenticates the runner with an OIDC token; without
    # this permission the lane fails closed instead of guessing.
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      # Test-only AES key for fieldCipher/shareToken at-rest proofs
      # (64 hex chars = 32 bytes; never a production value).
      ENCRYPTION_KEY: 3f9a2c8e1d4b6a0f7e5c3d2b1a098877665544332211ffeeddccbbaa99887766
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 'Guard: authenticate the runner (GitHub OIDC)'
        # GITHUB_ACTIONS=true, a container label and a run id are all settable by
        # anyone; none of them authenticates a runner. The database guard enables
        # its CI branch only for a GitHub Actions OIDC token whose RS256 signature
        # verifies against GitHub's published JWKS and whose issuer, audience,
        # expiry, repository and workflow claims match. The token is written to a
        # private file and never printed.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::This job cannot request an OIDC token (needs permissions: id-token: write). The database guard would refuse, so the lane stops here rather than degrading."
            exit 1
          fi
          TOKEN_FILE="${RUNNER_TEMP:-/tmp}/azm-ci-oidc.jwt"
          curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=azm-test-db-guard" \
            | node -e 'let body = ""; process.stdin.on("data", (chunk) => { body += chunk; }).on("end", () => { const token = JSON.parse(body).value; if (!token) process.exit(1); require("fs").writeFileSync(process.argv[1], token, { mode: 0o600 }); });' "$TOKEN_FILE"
          test -s "$TOKEN_FILE"
          echo "AZM_CI_OIDC_TOKEN_PATH=${TOKEN_FILE}" >> "$GITHUB_ENV"
          echo "Runner OIDC token acquired (value never printed)."

      - name: 'Guard: identify the PostgreSQL service container (exact identity)'
        # §392 — the database guard compares the server's own reported address
        # against an INDEPENDENT expectation, never against a private subnet: a
        # remote server behind a loopback port-forward or tunnel sits inside any
        # subnet we might allow. That expectation is this container's address,
        # read from docker itself, and exported to the test steps.
        #
        # Ambiguity is fatal on purpose: zero or several candidates, or several
        # network addresses, means the identity cannot be established, and an
        # unclear expectation must never silently disable the check.
        run: |
          set -euo pipefail
          mapfile -t CANDIDATES < <(docker ps -q --filter "ancestor=postgres:16")
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one postgres:16 service container, found ${#CANDIDATES[@]}. The database identity cannot be established; refusing to run with an unprovable target."
            exit 1
          fi
          CONTAINER="${CANDIDATES[0]}"
          mapfile -t ADDRESSES < <(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$CONTAINER" | sed '/^[[:space:]]*$/d')
          if [ "${#ADDRESSES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one network address for container ${CONTAINER}, found ${#ADDRESSES[@]}. Refusing to guess."
            exit 1
          fi
          ADDRESS="${ADDRESSES[0]}"
          if ! printf '%s' "$ADDRESS" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "::error::Container address '${ADDRESS}' is not a dotted IPv4 address."
            exit 1
          fi
          echo "PostgreSQL service container: ${CONTAINER}"
          echo "Exact expected database address: ${ADDRESS}"
          echo "AZM_TEST_PG_CONTAINER=${CONTAINER}" >> "$GITHUB_ENV"
          echo "AZM_EXPECTED_TEST_DB_ADDRESS=${ADDRESS}" >> "$GITHUB_ENV"
          # The service-container id from the job.services context: where the
          # workflow can supply it, the docker-selected container must be that one.
          SERVICE_CONTAINER='${{ job.services.postgres.id }}'
          # MANDATORY. The guard will not fall back to a docker ps selection: the
          # container it verifies must be the service container this job declared.
          if [ -z "$SERVICE_CONTAINER" ]; then
            echo "::error::job.services.postgres.id is empty. This job declares services.postgres, so the service container id must be available; refusing rather than falling back to a docker ps selection."
            exit 1
          fi
          case "$SERVICE_CONTAINER" in
            *[!0-9a-fA-F]*)
              echo "::error::job.services.postgres.id (${SERVICE_CONTAINER}) is not a hexadecimal container id."
              exit 1
              ;;
          esac
          if [ "${#SERVICE_CONTAINER}" -ne 64 ]; then
            echo "::error::job.services.postgres.id (${SERVICE_CONTAINER}) is ${#SERVICE_CONTAINER} characters, not a full 64-character container id."
            exit 1
          fi
          echo "AZM_CI_SERVICE_CONTAINER_ID=${SERVICE_CONTAINER}" >> "$GITHUB_ENV"
          echo "Service container declared by the job: ${SERVICE_CONTAINER}"

      - name: 'Guard: Postgres must be in production commit mode'
        # THE lane invariant. The main battery tunes synchronous_commit=off for
        # speed on its disposable database — that tuning must NEVER leak here.
        # If this step fails, someone tuned this lane's database: revert it.
        run: |
          set -euo pipefail
          # Reuse the container the identity step selected. There is ONE way this
          # lane decides which PostgreSQL it is talking to.
          CONTAINER="${AZM_TEST_PG_CONTAINER:?the identity step must export AZM_TEST_PG_CONTAINER}"
          ADDRESS=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$CONTAINER" | sed '/^[[:space:]]*$/d')
          if [ "${ADDRESS}" != "${AZM_EXPECTED_TEST_DB_ADDRESS:?the identity step must export AZM_EXPECTED_TEST_DB_ADDRESS}" ]; then
            echo "::error::The service container address is '${ADDRESS}', not the expected '${AZM_EXPECTED_TEST_DB_ADDRESS}'. The database identity is unstable; refusing to run."
            exit 1
          fi
          MODE=$(docker exec "$CONTAINER" psql -U postgres -d azm_test -tAc "SHOW synchronous_commit")
          echo "synchronous_commit = ${MODE}"
          if [ "${MODE}" != "on" ]; then
            echo "::error::This lane must run with synchronous_commit=on (production commit mode). Found: ${MODE}."
            exit 1
          fi

      - name: Apply database schema
        run: npx prisma db push --accept-data-loss

      - name: Install wallet address overlay
        run: node infra/install-wallet-address-overlay.js

      - name: Install custody execution overlay
        run: node infra/install-custody-execution-overlay.js

      - name: Install custody accounting overlay
        run: node infra/install-custody-accounting-overlay.js

      - name: Install transaction quote overlay
        run: node infra/install-transaction-quote-overlay.js

      - name: Install r19 smart-route execution snapshot overlay
        # r19: the snapshot columns the Smart Route executors/recovery read.
        # Mirrors the release chain (npm run release) and the migration.
        run: node infra/install-r19-smartroute-execution-snapshot-overlay.js
      - name: Install r42 financial idempotency overlay
        # r42: the FinancialOperation claim table behind the Idempotency-Key
        # financial authority. Mirrors the release chain (npm run release).
        run: node infra/install-r42-idempotency-overlay.js

      - name: Install GHS wallet + FX saved-rate overlay
        # FX-balance workstream: nativeGhsBalance CHECK floor + FxSavedRate
        # guards. Mirrors the release chain (npm run release). The demo rate
        # seed self-suppresses off disposable test DBs.
        run: node infra/install-ghs-wallet-overlay.js

      - name: Install native-GHS settlement overlay
        run: node infra/install-native-ghs-settlement-overlay.js
      - name: Install native-GHS withdrawal overlay
        run: node infra/install-native-ghs-withdrawal-overlay.js
      - name: Install standalone payment requests overlay
        # PaymentRequest table (server-owned request resource behind
        # /api/payment-requests). Mirrors the release chain (npm run release)
        # and prisma/migrations/20261010120000_payment_requests.
        run: node infra/install-payment-requests-overlay.js

      - name: Install payout reconciliation infrastructure
        run: node infra/install-payout-reconciliation-infra.js

      - name: Install fiat liquidity authority overlay
        run: node infra/install-fiat-liquidity-overlay.js

      - name: Install Model B settlement overlay
        run: node infra/install-model-b-settlement-overlay.js

      # PR #292 follow-up: match the test lane + the production release chain
      - name: Install business OS overlay
        run: node infra/install-business-os-overlay.js

      - name: Install inventory restock authority
        run: node infra/install-inventory-restock-overlay.js

      - name: Install reservation capacity authority
        run: node infra/install-reservation-capacity-overlay.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: 'Guard: the pinned #391 adapter commit must be fetchable'
        # §392 — the adapter-contract proof reads Agent B's published service
        # straight out of git at an exact commit. A shallow clone may not hold
        # that object, and a money-path contract proof that silently skips is
        # worse than one that fails, so this lane fetches the exact commit and
        # fails loudly when it cannot.
        env:
          ADAPTER_SHA: ea0e580f2d507e242c4b18e62f2a52175f621d8a
        run: |
          set -euo pipefail
          if ! git cat-file -e "${ADAPTER_SHA}:services/moolreBankPayoutService.js" 2>/dev/null; then
            git fetch --depth=1 origin "${ADAPTER_SHA}" \
              || git fetch --depth=2 origin refs/pull/391/head
          fi
          if ! git cat-file -e "${ADAPTER_SHA}:services/moolreBankPayoutService.js" 2>/dev/null; then
            echo "::error::The pinned #391 adapter commit ${ADAPTER_SHA} is not available in this clone. The contract proof must not be skipped."
            exit 1
          fi
          echo "Pinned #391 adapter ${ADAPTER_SHA} is present."

      - name: Apply control-plane migration (migration-only tables)
        # `prisma db push` creates only the models declared in schema.prisma. The
        # control-plane tables live solely in the 20260828040000 migration, so a
        # permission-gated admin route answers 403 until it is applied — which
        # would let a review-queue assertion pass without exercising the
        # successful response. Idempotent: objects that already exist (or seeds
        # that already ran) are tolerated; any other error fails the lane.
        run: |
          set -o pipefail
          psql "${TEST_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=0 \
            -f prisma/migrations/20260828040000_control_plane_staff_access/migration.sql \
            2>&1 | tee /tmp/control-plane.log
          if grep -E "ERROR" /tmp/control-plane.log \
             | grep -vE "42P07|42710|42P06|42701|23505|42P16|already exists"; then
            echo "::error::control-plane migration failed with a non-tolerable error."
            exit 1
          fi
          echo "control-plane schema present."

      - name: Test database identity guard (production commit mode)
        # The guard in front of the table-wide orphan sweep is money-path
        # infrastructure: its refusals are the only thing standing between that
        # statement and a database that is not provably disposable. It runs here,
        # as its own named step, before any integration suite, so this lane can
        # never be green with the guard unproven.
        run: |
          set -euo pipefail
          if [ -z "${AZM_EXPECTED_TEST_DB_ADDRESS:-}" ] || [ -z "${AZM_TEST_PG_CONTAINER:-}" ] || [ -z "${AZM_CI_OIDC_TOKEN_PATH:-}" ] || [ -z "${AZM_CI_SERVICE_CONTAINER_ID:-}" ]; then
            echo "::error::The database identity is not established (AZM_EXPECTED_TEST_DB_ADDRESS / AZM_TEST_PG_CONTAINER / AZM_CI_OIDC_TOKEN_PATH / AZM_CI_SERVICE_CONTAINER_ID). The guard would refuse, so the lane stops here."
            exit 1
          fi
          echo "Expected database address: ${AZM_EXPECTED_TEST_DB_ADDRESS} (container ${AZM_TEST_PG_CONTAINER})"
          npx jest __tests__/test-database-guard.test.js --runInBand --forceExit

      - name: Native-GHS financial-integrity suites (production commit mode)
        # §392 — the native-GHS money paths (park/review, pre-dispatch
        # revalidation, dispatch ownership, reconciliation, reversal atomicity,
        # shortfall integrity, and the #391 adapter contract) must be proven in
        # CI, not only locally. Explicit filenames: a glob would silently absorb
        # or drop a suite as files move.
        #
        # ORDER IS DELIBERATE. This step runs BEFORE the settlement battery: a few
        # of these suites assert absolute GHS liquidity and a freshly provisioned
        # database is the only honest fixture for that, while their residue is
        # cleared by the settlement battery's own TRUNCATE cleanup.
        run: |
          NG_SUITES=(
            "__tests__/native-ghs-withdrawal.test.js"
            "__tests__/native-ghs-wallet.test.js"
            "__tests__/native-ghs-quote-intent-binding.test.js"
            "__tests__/native-ghs-bank-quote.test.js"
            "__tests__/native-ghs-destination-snapshot.test.js"
            "__tests__/native-ghs-bank-predispatch-revalidation.test.js"
            "__tests__/native-ghs-bank-adapter-contract.test.js"
            "__tests__/native-ghs-bank-dispatch-status.test.js"
            "__tests__/native-ghs-bank-initiation-reconciliation.test.js"
            "__tests__/native-ghs-bank-reconciliation.test.js"
            "__tests__/native-ghs-dispatch-outcomes.test.js"
            "__tests__/native-ghs-reconciliation.test.js"
            "__tests__/native-ghs-admin-review.test.js"
            "__tests__/native-ghs-reversal-atomicity.test.js"
            "__tests__/native-ghs-funded-shortfall-reversal.test.js"
            "__tests__/native-ghs-shortfall-integrity.test.js"
            "__tests__/native-ghs-settlement.test.js"
            "__tests__/native-ghs-risk-gating.test.js"
            "__tests__/native-ghs-risk-hardening.test.js"
            "__tests__/native-ghs-trusted-age-risk.test.js"
            # §P.5-D mixed-regime over-dispatch: a legacy row under the latched
            # GHS authority is parked (LEGACY_ROW_UNDER_AUTHORITY_REGIME) and never
            # priced against the GHS projection. Needs the reconciliation + fiat
            # liquidity overlays this lane already installs.
            "__tests__/p5d-legacy-under-authority-regime.test.js"
            # §P.5-D latched regime contract: Boolean cleared after activation,
            # reversal under the latch, activation/creation mutual exclusion,
            # projection sync and unit-explicit readers.
            "__tests__/p5d-latched-regime-contract.test.js"
          )
          # Fail before jest if the identity expectation is missing: the suites
          # themselves refuse under GitHub Actions, but the lane must not depend
          # on a test file to notice that its own wiring is broken.
          if [ -z "${AZM_EXPECTED_TEST_DB_ADDRESS:-}" ]; then
            echo "::error::AZM_EXPECTED_TEST_DB_ADDRESS is not set. The native-GHS suites must run against a proven database identity."
            exit 1
          fi
          npx jest --runInBand --forceExit "${NG_SUITES[@]}"

      - name: Financial-integrity suites (production commit mode)
        # The explicit settlement/reconciliation/reversal set. Every suite here
        # proves a money-movement invariant that must hold under real commit
        # durability. Adding a suite to this lane is a deliberate decision —
        # do not bulk-paste the whole battery here; that is the OTHER lane.
        # Serial (shared disposable DB, TRUNCATE cleanup) + forceExit (app
        # bootstrap holds handles open), mirroring the main battery's contract.
        run: |
          # Bash array keeps each path an EXACT positional argument:
          # a plain-scalar multi-line run folds newlines to spaces and
          # jest receives one broken regex matching nothing (run 35512019320).
          SUITES=(
            "__tests__/p2p-settlement-integrity.test.js"
            "__tests__/azm-auction-settlement-integrity.test.js"
            "__tests__/dine-in-customer-order-settlement.test.js"
            "__tests__/p5e-model-b-settlement.test.js"
            "__tests__/withdrawal-reconciliation-settlement.test.js"
            "__tests__/withdrawal-reconciliation-finance-settlement.test.js"
            "__tests__/withdrawal-reconciliation-terminal-claim.test.js"
            "__tests__/ewa-withdrawal-intent-reconciliation.db.test.js"
            "__tests__/r15a-reconciliation-single-claim.test.js"
            "__tests__/r15h-reconciliation-resolves-through-status-contract.test.js"
            "__tests__/r15k-reconciliation-provider-ownership.test.js"
            "__tests__/r15c-disbursement-outcome-classification.test.js"
            "__tests__/r15d-withdrawal-outcome-honesty.test.js"
            "__tests__/r15e-providerref-cas.test.js"
            "__tests__/r15f2-evidence-write-transaction-safety.test.js"
            "__tests__/r15g-moolre-status-contract.test.js"
            "__tests__/r15b-moolre-collection-outcomes.test.js"
            "__tests__/payout-unknown-outcome.test.js"
            # §r271 P0 — withdrawal dead-end recovery proofs (APPROVED row
            # worker/recon visibility, admin rejection from APPROVED, and the
            # deterministic NEEDS_MANUAL_REVIEW exits) are financial integrity:
            # they prove customer money cannot strand in a status no authority
            # reads. DB-backed, production-commit-mode rehearsed here.
            "__tests__/r271e-approved-withdrawal-recovery.test.js"
            "__tests__/r271f-manual-review-recovery.test.js"
            "__tests__/r271d-late-deposit-settlement.test.js"
            "__tests__/admin-reconciliation-claims.test.js"
            "__tests__/payment-failover.test.js"
            "__tests__/escrow-flow.test.js"
            "__tests__/escrow-refund-realtime.test.js"
            "__tests__/escrow-dispute-integrity.test.js"
            "__tests__/escrow-convergence.test.js"
            "__tests__/booking-escrow-financial-integrity.test.js"
            "__tests__/r29-reservation-lifecycle-authority.test.js"
            "__tests__/r30-r25-r29-funding-lifecycle-integration.test.js"
            "__tests__/r31-reservation-capacity-authority.test.js"
            "__tests__/inventory-restock-idempotency.test.js"
            "__tests__/r40-restock-fingerprint-v2.pg.test.js"
            "__tests__/azm-conversion-economic-atomicity.test.js"
            "__tests__/azm-stake-economic-atomicity.test.js"
            "__tests__/azm-gift-economic-atomicity.test.js"
            "__tests__/susu-cycle-payout-single-winner.test.js"
            "__tests__/susu-cycle-contribution-atomicity.test.js"
            "__tests__/legacy-susu-economic-atomicity.test.js"
            "__tests__/withdrawal-fee-discount-atomicity.test.js"
            "__tests__/business-invoice-payment-concurrency.test.js"
            "__tests__/payroll-ewa-settlement.db.test.js"
            # §r41 final-audit proofs — real-PostgreSQL DB-boundary authority
            # races (escrow terminal states, business-OS finance, AZM economy).
            # PG-backed, so they belong in this production-commit-mode lane.
            # The r41 payout-parking suite is unit-only (mocked tx) and stays
            # in the main battery lane.
            "__tests__/r41-escrow-terminal-authority.pg.test.js"
            "__tests__/r41-business-os-authority.pg.test.js"
            "__tests__/r41-azm-economy-authority.pg.test.js"
            # §r41 third-pass review — the transit funding/cancellation
            # economic-authority proofs (fund-after-cancellation race,
            # linkage-pinned create/link-vs-cancel, escrow-first serialization)
            # are financial integrity: they prove customer money cannot strand.
            "__tests__/r41-transit-funding-cancellation-authority.pg.test.js"
            # §r42 — shared financial idempotency authority: the durable
            # claim/state-machine proofs and the wired multi-currency
            # conversion exactly-once identity.
            "__tests__/r42-shared-idempotency-authority.pg.test.js"
            # §r42 follow-up review — trade initiation idempotency: the
            # false releaseOn4xx declaration is removed and the post-commit
            # failure RETAIN, concurrent duplicate, and pre-economics release
            # contracts are proven against the real controller + middleware.
            "__tests__/r42-trade-initiation.pg.test.js"
            # §r42.1 — wired idempotency, first tranche: the claim contract
            # proven on the REAL middleware + REAL controllers for the six
            # promoted client operations (savings deposit/withdraw, vault
            # deposit/break, wallet internal-transfer over real HTTP,
            # peer send) — byte-identical committed replay, concurrent
            # exactly-once, crash-after-commit claim survival, pre-economics
            # release, and divergent-identity fail-closed.
            "__tests__/r42.1-wired-first-tranche.pg.test.js"
            # §r42.1 — wired idempotency, second tranche (the #318 closure):
            # the same wired claim contract proven on the REAL middleware +
            # REAL controllers for the five settlement-side operations
            # (escrow fund, AZM conversion, AZM gifts, order-book placement,
            # P2P completion) — byte-identical committed replay, concurrent
            # exactly-once, crash-after-commit claim survival, pre-economics
            # 4xx release, and divergent-payload fail-closed.
            "__tests__/r42.1-idempotency-closure.pg.test.js"
            # Standalone payment requests (request-resource lifecycle): the
            # create idempotency exactly-once proof, the single-winner
            # cancel-vs-decline terminal races, and the immutable exact-
            # decimal/privacy/authorization contracts, against the REAL
            # controller + middleware over real PostgreSQL.
            "__tests__/payment-requests-authority.pg.test.js"
          )
          npx jest --runInBand --forceExit "${SUITES[@]}"

      - name: 'Guard: re-verify commit mode was never relaxed mid-run'
        run: |
          set -euo pipefail
          CONTAINER="${AZM_TEST_PG_CONTAINER:?the identity step must export AZM_TEST_PG_CONTAINER}"
          ADDRESS=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$CONTAINER" | sed '/^[[:space:]]*$/d')
          if [ "${ADDRESS}" != "${AZM_EXPECTED_TEST_DB_ADDRESS:?the identity step must export AZM_EXPECTED_TEST_DB_ADDRESS}" ]; then
            echo "::error::The service container address changed during the run (now: '${ADDRESS}', expected '${AZM_EXPECTED_TEST_DB_ADDRESS}'). The database identity was not stable; the rehearsal is invalid."
            exit 1
          fi
          MODE=$(docker exec "$CONTAINER" psql -U postgres -d azm_test -tAc "SHOW synchronous_commit")
          if [ "${MODE}" != "on" ]; then
            echo "::error::synchronous_commit was relaxed during the run (now: ${MODE}). The durability rehearsal is invalid."
            exit 1
          fi
          echo "Database identity held at ${AZM_EXPECTED_TEST_DB_ADDRESS} for the whole run."
          echo "Durability rehearsal completed in production commit mode (synchronous_commit=on)."
