name: Hotel v2 rebase

on:
  push:
    branches: [fix/hotel-ops-business-scope-v2]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/hotel-ops-business-scope-v2
      - name: Reapply reviewed hotel commits onto current main
        run: |
          set -e
          git config user.name azaman-automation
          git config user.email automation@azaman.local
          cherry() {
            if git cherry-pick --no-commit "$1"; then return 0; fi
            if git diff --name-only --diff-filter=U | grep -qx '__tests__/business-os.test.js'; then
              git checkout --ours __tests__/business-os.test.js
              git add __tests__/business-os.test.js
              git cherry-pick --continue
            else
              git cherry-pick --abort
              exit 1
            fi
          }
          cherry 904370b4ce36b928ae07219d71bd12e5e988dfd5
          cherry 4033f4b94e31614ac4c4b7a0024cb0eac3dd5853
          cherry 6adc00d87c32bcc8645d8fa1e2b2caf22994de14
          python3 - <<'PY'
          from pathlib import Path
          p = Path('__tests__/business-os.test.js')
          s = p.read_text()
          replacements = {
            "svc.updateRoomStatus(testRoom.id, 'MAINTENANCE', 'AC repair needed')": "svc.updateRoomStatus(testRoom.id, 'MAINTENANCE', 'AC repair needed', businessProfile.id)",
            "svc.updateRoomStatus(testRoom.id, 'AVAILABLE', null)": "svc.updateRoomStatus(testRoom.id, 'AVAILABLE', null, businessProfile.id)",
            "svc.generateHousekeepingTask(reservation.id)": "svc.generateHousekeepingTask(reservation.id, businessProfile.id)",
            "svc.assignHousekeepingTask(task.id, testEmployee.id)": "svc.assignHousekeepingTask(task.id, testEmployee.id, businessProfile.id)",
            "svc.updateChecklist(task.id, 0, true)": "svc.updateChecklist(task.id, 0, true, businessProfile.id)",
            "svc.completeHousekeeping(task.id, { notes: 'All clean' })": "svc.completeHousekeeping(task.id, { notes: 'All clean' }, businessProfile.id)",
          }
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/hotel-v2-rebase.yml
          git add -A
          git commit -m 'fix(hotel): reapply scoped ops hardening onto current main'
          git push origin HEAD:fix/hotel-ops-business-scope-v2
