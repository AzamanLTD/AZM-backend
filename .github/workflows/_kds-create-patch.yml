name: KDS create integrity patch
on:
  push:
    branches: [fix/restaurant-kds-create-integrity-clean]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply KDS creation ownership checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/businessOS/restaurantOpsService.js')
          s=p.read_text()
          old="""    async createKitchenOrder({ businessProfileId, locationId, businessOrderId, tableNumber, serverName, items, station, specialInstructions, isRush }) {\n        // Generate ticket number (sequential per location per day)"""
          new="""    async createKitchenOrder({ businessProfileId, locationId, businessOrderId, tableNumber, serverName, items, station, specialInstructions, isRush }) {\n        if (!businessProfileId) throw new Error('Business profile context is required.');\n        if (locationId) {\n            const location = await this.prisma.businessLocation.findFirst({\n                where: { id: locationId, businessProfileId },\n                select: { id: true },\n            });\n            if (!location) throw new Error('Location not found for this business.');\n        }\n        if (businessOrderId) {\n            const businessOrder = await this.prisma.businessOrder.findFirst({\n                where: { id: businessOrderId, businessProfileId },\n                select: { id: true },\n            });\n            if (!businessOrder) throw new Error('Business order not found for this business.');\n        }\n\n        // Generate ticket number (sequential per location per day)"""
          if old not in s: raise SystemExit('create signature pattern missing')
          s=s.replace(old,new,1)
          old="""            const product = await this.prisma.businessProduct.findUnique({\n                where: { id: item.productId },\n            });\n            if (product) {"""
          new="""            const product = await this.prisma.businessProduct.findFirst({\n                where: { id: item.productId, businessProfileId, isActive: true },\n            });\n            if (!product) throw new Error('Product not found for this business: ' + item.productId);\n            {"""
          if old not in s: raise SystemExit('product pattern missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/_kds-create-patch.yml
          git config user.name 'azaman-ci'
          git config user.email 'azaman-ci@users.noreply.github.com'
          git add services/businessOS/restaurantOpsService.js .github/workflows/_kds-create-patch.yml
          git commit -m 'fix(restaurant): scope KDS creation inputs'
          git push origin HEAD:fix/restaurant-kds-create-integrity-clean
