name: Prepare fiat withdrawal unit guard
on:
  push:
    branches: [fix/fiat-withdrawal-gateway-unit-guard]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor == 'pyraxxz' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch controller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('controllers/withdrawalController.js')
          s=p.read_text()
          old='''        try {\n            const dispatch = await mtnDisbursementService.initiateTransfer({\n                referenceId:    reference,\n                amountGhs:      data.payoutGhs || data.withdrawalAmount,  // GHS amount derived by service if available\n                recipientPhone: phone,\n                externalId:     reference,\n                payerMessage:   `Azaman withdrawal ref ${reference}`,\n                payeeNote:      `Withdrawal ${reference}`\n            });'''
          new='''        try {\n            // `payoutGhs` is the only value with GHS semantics. Never fall back\n            // to `withdrawalAmount`, which is the user's USDC debit amount.\n            const payoutGhs = Number(data.payoutGhs);\n            if (!Number.isFinite(payoutGhs) || payoutGhs <= 0) {\n                throw new Error('FIAT_PAYOUT_AMOUNT_MISSING');\n            }\n\n            const dispatch = await mtnDisbursementService.initiateTransfer({\n                referenceId:    reference,\n                amountGhs:      payoutGhs,\n                recipientPhone: phone,\n                externalId:     reference,\n                payerMessage:   `Azaman withdrawal ref ${reference}`,\n                payeeNote:      `Withdrawal ${reference}`\n            });'''
          if old not in s: raise SystemExit('expected payout dispatch block not found')
          s=s.replace(old,new,1)
          old2="""                metadata: { amountGhs: amount, provider: payoutMethod, reference }, ipAddress: req.ip,"""
          new2="""                metadata: { amountGhs: data.payoutGhs, amountUsdc: parseFloat(amount), provider: payoutMethod, reference }, ipAddress: req.ip,"""
          if old2 not in s: raise SystemExit('expected withdrawal audit metadata not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          t=Path('tests/withdrawalController.unit-guard.test.js')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text(r'''const fs = require('fs');
const path = require('path');

describe('fiat withdrawal gateway amount unit guard', () => {
  test('never falls back from GHS payout to USDC withdrawal amount', () => {
    const source = fs.readFileSync(
      path.join(__dirname, '..', 'controllers', 'withdrawalController.js'),
      'utf8',
    );

    expect(source).toContain('const payoutGhs = Number(data.payoutGhs);');
    expect(source).toContain('amountGhs:      payoutGhs');
    expect(source).not.toContain('amountGhs:      data.payoutGhs || data.withdrawalAmount');
  });

  test('records both GHS payout and USDC debit units in the audit event', () => {
    const source = fs.readFileSync(
      path.join(__dirname, '..', 'controllers', 'withdrawalController.js'),
      'utf8',
    );
    expect(source).toContain('amountGhs: data.payoutGhs, amountUsdc: parseFloat(amount)');
  });
});
''')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-withdrawal-unit-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controllers/withdrawalController.js tests/withdrawalController.unit-guard.test.js .github/workflows/fix-withdrawal-unit-guard.yml
          git commit -m 'fix(finance): guard fiat payout units at gateway boundary'
          git push origin HEAD:${{ github.ref_name }}
