name: _fix-p2p-ping-test

on:
  push:
    branches: [fix/p2p-accept-ping-lifecycle-race]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('__tests__/p2p-accept-ping-lifecycle.test.js')
          text = p.read_text()
          text = text.replace(".then(() => ({ ok: true })),\n            prisma.$transaction(async (tx) => {", ".then((result) => ({ ok: true, result })),\n            prisma.$transaction(async (tx) => {", 1)
          text = text.replace("const toppedUp = outcomes.some((o) => o.ok === true && 'newAvailableBalance' in o);", "const toppedUp = outcomes.some((o) => o.ok === true && o.result?.newAvailableBalance !== undefined);")
          p.write_text(text)
          PY
          rm -f .github/workflows/_fix_p2p_ping_test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __tests__/p2p-accept-ping-lifecycle.test.js .github/workflows/_fix_p2p_ping_test.yml
          git commit -m 'test(p2p): retain accept ping result in race assertion'
          git push origin HEAD:${GITHUB_REF_NAME}
