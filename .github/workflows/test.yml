name: Azaman Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Apply database schema
        # db push (not migrate deploy) — matches our established prod pattern
        # (prod is db-push managed; see infra/autoRelease.js). --accept-data-loss
        # is safe here: the CI Postgres is disposable and recreated each run.
        run: npx prisma db push --accept-data-loss

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        # --runInBand: the DB-backed suites TRUNCATE the shared Postgres between
        #   tests; parallel jest workers would truncate each other's rows and flake.
        # --forceExit: __tests__/auth.test.js boots the Express app (supertest),
        #   which holds its own Prisma client + pg pool open; force a clean exit so
        #   CI doesn't hang waiting on those handles.
        #
        # Retry-once: a shared CI Postgres container can occasionally be slow
        # enough to blow a DB-hook's timeout even with generous limits (seen on
        # cc5cc7c — 1/255 tests timed out on a TRUNCATE hook, root cause was a
        # loaded runner, not a code regression; every subsequent local run of the
        # same commit was 255/255 green). Rather than requiring a human to notice
        # a flake and manually re-run the workflow, retry the whole suite once
        # automatically. A REAL failure reproduces on the retry and still fails
        # the job — this only absorbs one-off infra flakiness.
        run: |
          set +e
          npm test -- --runInBand --forceExit
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::Test suite failed on first attempt — retrying once in case of CI-environment flakiness (e.g. a slow shared DB container)."
            npm test -- --runInBand --forceExit
            code=$?
          fi
          exit $code
