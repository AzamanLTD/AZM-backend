name: Azaman Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Budget must cover the worst case: one full suite run PLUS the single
    # retry-on-failure. Measured full run with tuned Postgres: minutes, not
    # tens of minutes on a healthy runner. But observed 2026-09-20: a noisy
    # GitHub runner executed the same 236-suite battery ~4x slower (32.5 min
    # for attempt one) — a retry on such a runner needs ~70 min, which the
    # previous 45-min budget cut off mid-suite, converting a transient
    # slow-runner retry into a hard job timeout. 90 min covers the observed
    # slow-runner full+retry case with margin; on healthy runners the job
    # finishes in ~10 min regardless.
    timeout-minutes: 90

    # The database guard authenticates the runner with an OIDC token. This is a
    # job-level block: it ADDS id-token: write to whatever the workflow grants.
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Disposable Redis for the app-unlock atomicity proofs. Temporary and
      # local to this job; no external credentials are involved.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      # The suite database every PostgreSQL suite shares, overlay structures
      # included. It must NOT be the target of a force-reset.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      # Only the saved-account migration suite may reset a database, and only
      # this one. Keeping it in TEST_DATABASE_URL meant the reset destroyed the
      # schema the other PostgreSQL suites were still using.
      SAVED_ACCOUNTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_saved_service_accounts_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      # Test-only AES key for fieldCipher/shareToken at-rest proofs
      # (64 hex chars = 32 bytes; never a production value).
      ENCRYPTION_KEY: 3f9a2c8e1d4b6a0f7e5c3d2b1a098877665544332211ffeeddccbbaa99887766
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Prisma schema validation gate
        # Explicit, named validation of prisma/schema.prisma — do not rely on
        # `db push`/`generate` failing indirectly on a broken schema. A schema
        # that does not validate must stop CI at its own gate with a clear
        # name in the summary.
        run: npx prisma validate

      - name: 'Guard: authenticate the runner (GitHub OIDC)'
        # GITHUB_ACTIONS=true, a container label and a run id are all settable by
        # anyone; none of them authenticates a runner. The database guard enables
        # its CI branch only for a GitHub Actions OIDC token whose RS256 signature
        # verifies against GitHub's published JWKS and whose issuer, audience,
        # expiry, repository and workflow claims match. The token is written to a
        # private file and never printed.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::This job cannot request an OIDC token (needs permissions: id-token: write). The database guard would refuse, so the lane stops here rather than degrading."
            exit 1
          fi
          TOKEN_FILE="${RUNNER_TEMP:-/tmp}/azm-ci-oidc.jwt"
          curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=azm-test-db-guard" \
            | node -e 'let body = ""; process.stdin.on("data", (chunk) => { body += chunk; }).on("end", () => { const token = JSON.parse(body).value; if (!token) process.exit(1); require("fs").writeFileSync(process.argv[1], token, { mode: 0o600 }); });' "$TOKEN_FILE"
          test -s "$TOKEN_FILE"
          echo "AZM_CI_OIDC_TOKEN_PATH=${TOKEN_FILE}" >> "$GITHUB_ENV"
          echo "Runner OIDC token acquired (value never printed)."

      - name: 'Guard: identify the PostgreSQL service container (exact identity)'
        # §392 — __tests__/helpers/testDatabaseGuard.js refuses to run its
        # table-wide maintenance statement unless the server's OWN reported
        # address matches an independent expectation. That expectation is this
        # container's address, read from docker itself. Without this step a
        # GitHub Actions run has no expectation and the guard fails closed, so
        # the identity is established here for this lane too, exactly as the
        # financial-durability lane does.
        #
        # Ambiguity is fatal: zero or several candidates, or several network
        # addresses, means the target cannot be proven.
        run: |
          set -euo pipefail
          mapfile -t CANDIDATES < <(docker ps -q --filter "ancestor=postgres:16")
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one postgres:16 service container, found ${#CANDIDATES[@]}. The database identity cannot be established."
            exit 1
          fi
          CONTAINER="${CANDIDATES[0]}"
          mapfile -t ADDRESSES < <(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$CONTAINER" | sed '/^[[:space:]]*$/d')
          if [ "${#ADDRESSES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one network address for container ${CONTAINER}, found ${#ADDRESSES[@]}. Refusing to guess."
            exit 1
          fi
          ADDRESS="${ADDRESSES[0]}"
          if ! printf '%s' "$ADDRESS" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "::error::Container address '${ADDRESS}' is not a dotted IPv4 address."
            exit 1
          fi
          echo "PostgreSQL service container: ${CONTAINER}"
          echo "Exact expected database address: ${ADDRESS}"
          echo "AZM_TEST_PG_CONTAINER=${CONTAINER}" >> "$GITHUB_ENV"
          echo "AZM_EXPECTED_TEST_DB_ADDRESS=${ADDRESS}" >> "$GITHUB_ENV"
          # The service-container id from the job.services context: where the
          # workflow can supply it, the docker-selected container must be that one.
          SERVICE_CONTAINER='${{ job.services.postgres.id }}'
          # MANDATORY. The guard will not fall back to a docker ps selection: the
          # container it verifies must be the service container this job declared.
          if [ -z "$SERVICE_CONTAINER" ]; then
            echo "::error::job.services.postgres.id is empty. This job declares services.postgres, so the service container id must be available; refusing rather than falling back to a docker ps selection."
            exit 1
          fi
          case "$SERVICE_CONTAINER" in
            *[!0-9a-fA-F]*)
              echo "::error::job.services.postgres.id (${SERVICE_CONTAINER}) is not a hexadecimal container id."
              exit 1
              ;;
          esac
          if [ "${#SERVICE_CONTAINER}" -ne 64 ]; then
            echo "::error::job.services.postgres.id (${SERVICE_CONTAINER}) is ${#SERVICE_CONTAINER} characters, not a full 64-character container id."
            exit 1
          fi
          echo "AZM_CI_SERVICE_CONTAINER_ID=${SERVICE_CONTAINER}" >> "$GITHUB_ENV"
          echo "Service container declared by the job: ${SERVICE_CONTAINER}"

      - name: Apply database schema
        # CI uses a disposable PostgreSQL instance. Production remains managed
        # by the repository's established db-push release process.
        run: npx prisma db push --accept-data-loss

      - name: Install wallet address overlay
        run: node infra/install-wallet-address-overlay.js

      - name: Install custody execution overlay
        run: node infra/install-custody-execution-overlay.js

      - name: Install custody accounting overlay
        run: node infra/install-custody-accounting-overlay.js

      - name: Install transaction quote overlay
        run: node infra/install-transaction-quote-overlay.js

      - name: Install r19 smart-route execution snapshot overlay
        # r19: the snapshot columns the Smart Route executors/recovery read.
        # Mirrors the release chain (npm run release) and the migration.
        run: node infra/install-r19-smartroute-execution-snapshot-overlay.js
      - name: Install r42 financial idempotency overlay
        # r42: the FinancialOperation claim table behind the Idempotency-Key
        # financial authority. Mirrors the release chain (npm run release).
        run: node infra/install-r42-idempotency-overlay.js
      - name: Install standalone payment requests overlay
        # PaymentRequest table (server-owned request resource behind
        # /api/payment-requests). Mirrors the release chain (npm run release)
        # and prisma/migrations/20261010120000_payment_requests.
        run: node infra/install-payment-requests-overlay.js

      - name: Install payout reconciliation infrastructure
        run: node infra/install-payout-reconciliation-infra.js

      - name: Install fiat liquidity authority overlay
        run: node infra/install-fiat-liquidity-overlay.js

      - name: Install Model B settlement overlay
        run: node infra/install-model-b-settlement-overlay.js

      - name: Install GHS wallet + FX saved-rate overlay
        # FX-balance workstream: nativeGhsBalance CHECK floor, FxSavedRate
        # guards, and (on the disposable CI test DB) the explicit demo rate
        # seed used by the display-fallback contract tests.
        run: node infra/install-ghs-wallet-overlay.js

      - name: Install native-GHS settlement overlay
        run: node infra/install-native-ghs-settlement-overlay.js
      - name: Install native-GHS withdrawal overlay
        run: node infra/install-native-ghs-withdrawal-overlay.js

      # PR #292 follow-up: the release chain (npm run release) executes the
      # business-os overlay in production (it is the schema authority for
      # Business OS DDL, including the ProfitSource EWA_FEE enum value that
      # the EWA fee realization writes to AdminProfitLog). CI previously
      # never executed it, so a broken business-os overlay would only be
      # discovered at deploy time. CI now exercises the exact same installer.
      - name: Install business OS overlay
        run: node infra/install-business-os-overlay.js

      - name: Install retail checkout integrity overlay
        # Retail checkout convergence (BusinessOrderItem stockReserved/variants,
        # the storefront checkout identity). CI's disposable db-push database
        # only carries what prisma/schema.prisma declares, so without this
        # step the retail columns are missing and the checkout finalization
        # UPDATE fails into a durable 503. Mirrors the production autoRelease
        # chain, which converges this same installer after every db-push.
        run: node infra/install-retail-checkout-integrity.js

      - name: Install business price overlay
        # GHS listing prices (P1): the DB-enforced constraints Prisma cannot
        # express — partial unique single-current-price index, effective-window
        # CHECK, positive-amount CHECK, closed value domains. Mirrors the
        # release chain (npm run release).
        run: node infra/install-business-price-overlay.js
      - name: Install marketplace discovery overlay
        # Marketplace Mix P1: marketplace-visibility flag (§9 D-5), section
        # taxonomy mapping table + backfill (§4 D-2), discovery indexes
        # (§3.3). Mirrors the release chain (npm run release).
        run: node infra/install-marketplace-discovery-overlay.js
      - name: Install business offered-categories overlay
        # Workstream D (PR #366): BusinessProfile.offeredCategories enum
        # array column. Mirrors the release chain (npm run release); after
        # db push the ADD COLUMN IF NOT EXISTS no-ops.
        run: node infra/install-business-offered-categories-overlay.js

      - name: Install app-unlock TOTP claim authority
        # WP-D packaging: the durable single-use TOTP claim table is created by
        # an overlay installer because the release path (npm run release) runs
        # installers and never `prisma migrate deploy`. Without it app-unlock
        # TOTP fails closed (503). Idempotent; mirrors the release chain.
        run: node infra/install-app-unlock-totp-claim.js

      - name: Install inventory restock authority
        run: node infra/install-inventory-restock-overlay.js

      - name: Install reservation capacity authority
        run: node infra/install-reservation-capacity-overlay.js

      - name: Install E2EE server-blind authority
        run: node infra/install-e2ee-server-blind-overlay.js

      # §r40.1 P1-L — static invariant audit, companion to the behavioral
      # proof suites: no private-key columns can enter the E2EE schema, the
      # feature stays disabled by default, restock fingerprints stay exact.
      - name: E2EE server-blind invariant audit
        run: node infra/audit-e2ee-invariants.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Tune disposable Postgres for test workloads
        # The service container pays a real fsync on every commit; the
        # TRUNCATE-heavy cleanup hooks make the suite 10x+ slower than the
        # same run against a local database. This is a THROWAWAY CI database
        # (no durability requirement), so relax commit durability:
        # synchronous_commit is applied to existing sessions via SIGHUP —
        # no container restart needed. Production databases are unaffected.
        # This tuning is FORBIDDEN in the financial-durability lane
        # (financial-durability.yml), which rehearses the critical financial
        # suites in the production commit mode and fails if it finds it.
        # prisma db execute wraps statements in a transaction and
        # ALTER SYSTEM cannot run inside one (run 35367906505), so run
        # psql inside the service container directly.
        run: |
          # Reuse the container the identity step selected: one way to decide
          # which PostgreSQL this lane is talking to.
          CONTAINER="${AZM_TEST_PG_CONTAINER:?the identity step must export AZM_TEST_PG_CONTAINER}"
          docker exec "$CONTAINER" psql -U postgres -d azm_test \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "SELECT pg_reload_conf();" \
            -c "ALTER DATABASE azm_test SET idle_session_timeout = '90s'"
        # idle_session_timeout (PG14+, no restart needed): the serial jest
        # battery accumulates leaked Prisma handles across suites — once the
        # leaks pass ~max_connections (100), postgres starts refusing NEW
        # connections ("sorry, too many clients already"), which turns a
        # healthy gate into false mid-run failures. Reaping sessions that
        # have been idle >90s keeps the budget clear; active suites and
        # in-flight transactions are untouched (testTimeout is 30s, far
        # below the reap window, and open $transaction blocks are governed
        # by a different timeout we are not setting). Observed on the
        # 2026-10-22 gate: 62 leaked idles after ~115 suites.

      - name: App unlock against real Redis
        # Scoped deliberately: a global REDIS_URL switches unrelated suites onto
        # shared limiter/idempotency state that they were not written for. Only
        # the app-unlock atomicity proof needs the real store.
        run: npx jest __tests__/app-unlock-redis --runInBand --forceExit
        env:
          REDIS_URL: redis://localhost:6379

      - name: Create the isolated saved-account test database
        # Kept separate from azm_test on purpose: the migration test resets its
        # target, and azm_test carries the overlay structures the rest of the
        # suite depends on.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE azm_saved_service_accounts_test;'
          PGPASSWORD=postgres psql -h localhost -U postgres -d azm_saved_service_accounts_test \
            -c 'SELECT current_database();'

      - name: Run tests
        # DB-backed suites share one disposable database and truncate between
        # tests, so Jest must remain serial. The application bootstrap also
        # leaves Prisma/pg handles open, hence forceExit.
        #
        # THE GUARD'S PROOF IS RENEWED, NOT WEAKENED. The database guard
        # authenticates the runner with a GitHub OIDC token, and that token is
        # short-lived while this suite now runs longer than one token lives —
        # every test after expiry was refused ("the OIDC token expired"). The
        # token file is therefore refreshed from the runner's own OIDC endpoint
        # every few minutes, atomically (write + rename), so the guard always
        # reads a complete, currently-valid token and still performs every one
        # of its checks. Nothing about the checks, the audience, the workflow
        # allowlist or the run identity changes.
        #
        # Retry once only to absorb a transient CI database/runner timeout;
        # genuine test failures must reproduce and still fail the job.
        run: |
          set +e
          if [ -z "${AZM_EXPECTED_TEST_DB_ADDRESS:-}" ]; then
            echo "::error::AZM_EXPECTED_TEST_DB_ADDRESS is not set; the database identity guard would refuse. Fix the identity step."
            exit 1
          fi
          TOKEN_FILE="${AZM_CI_OIDC_TOKEN_PATH:-}"
          if [ -z "$TOKEN_FILE" ]; then
            echo "::error::AZM_CI_OIDC_TOKEN_PATH is not set; the database identity guard would refuse. Fix the OIDC step."
            exit 1
          fi

          refresh_oidc() {
            local tmp="${TOKEN_FILE}.next"
            curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=azm-test-db-guard" \
              | node -e 'let body = ""; process.stdin.on("data", (chunk) => { body += chunk; }).on("end", () => { const token = JSON.parse(body).value; if (!token) process.exit(1); require("fs").writeFileSync(process.argv[1], token, { mode: 0o600 }); });' "$tmp"
            if [ ! -s "$tmp" ]; then
              echo "::error::could not refresh the runner OIDC token; the guard will refuse once the current token expires."
              return 1
            fi
            mv -f "$tmp" "$TOKEN_FILE"   # atomic: the guard never reads a partial token
          }

          # Background renewer: keeps the guard's proof valid for the whole run.
          (
            while true; do
              sleep 240
              refresh_oidc || exit 1
              echo "Runner OIDC token refreshed."
            done
          ) &
          RENEW_PID=$!
          trap 'kill "$RENEW_PID" 2>/dev/null' EXIT

          npm test -- --runInBand --forceExit
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::Test suite failed on first attempt — retrying once for transient CI-environment failures."
            refresh_oidc
            npm test -- --runInBand --forceExit
            code=$?
          fi
          exit $code


      - name: Checkout authoritative frontend (AZM-businessPortal)
        # route-check is a FRONTEND/BACKEND compatibility gate: it must scan
        # the real frontend API layer, never pass vacuously on a backend-only
        # workspace. The frontend repository is public, so no cross-repo
        # credentials are needed; the default GITHUB_TOKEN cannot read other
        # private repos anyway. Pinned to main: the gate validates the
        # CURRENT authoritative frontend against this backend.
        uses: actions/checkout@v7
        with:
          repository: AzamanLTD/AZM-businessPortal
          ref: main
          path: frontend/AZM-businessPortal

      - name: Verify route registry against frontend API usage
        # Fail-closed: ROUTE_CHECK_REQUIRE_FRONTEND=1 makes an absent or
        # empty frontend source fail the gate instead of a zero-call PASS.
        env:
          ROUTE_CHECK_FRONTEND_ROOT: ${{ github.workspace }}/frontend/AZM-businessPortal
          ROUTE_CHECK_REQUIRE_FRONTEND: '1'
        run: npm run route-check

      - name: Database backup and restore drill
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          BACKUP_DRILL_ALLOW_MUTATION: '1'
        run: npm run db:recovery-drill
