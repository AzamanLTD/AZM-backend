name: Azaman Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npx prisma db push --accept-data-loss

      - name: Install transaction quote overlay
        run: node infra/install-transaction-quote-overlay.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --forceExit 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::warning::Test suite failed on first attempt — retrying once for transient CI-environment failures."
            npm test -- --runInBand --forceExit 2>&1 | tee -a test-output.log
            code=${PIPESTATUS[0]}
          fi
          exit $code

      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandatory-test-output
          path: test-output.log
          retention-days: 1

      - name: Database backup and restore drill
        if: success()
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          BACKUP_DRILL_ALLOW_MUTATION: '1'
        run: npm run db:recovery-drill
