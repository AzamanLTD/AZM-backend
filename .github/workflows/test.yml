name: Azaman Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Budget must cover the worst case: one full suite run PLUS the single
    # retry-on-failure. Measured full run with tuned Postgres: minutes, not
    # tens of minutes — but keep a wide margin so a transient-failure retry
    # can never be killed by the job clock mid-suite again.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/azm_test?schema=public
      JWT_SECRET: test_secret_exactly_32_characters_long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Apply database schema
        # CI uses a disposable PostgreSQL instance. Production remains managed
        # by the repository's established db-push release process.
        run: npx prisma db push --accept-data-loss

      - name: Install wallet address overlay
        run: node infra/install-wallet-address-overlay.js

      - name: Install custody execution overlay
        run: node infra/install-custody-execution-overlay.js

      - name: Install custody accounting overlay
        run: node infra/install-custody-accounting-overlay.js

      - name: Install transaction quote overlay
        run: node infra/install-transaction-quote-overlay.js

      - name: Install payout reconciliation infrastructure
        run: node infra/install-payout-reconciliation-infra.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Tune disposable Postgres for test workloads
        # The service container pays a real fsync on every commit; the
        # TRUNCATE-heavy cleanup hooks make the suite 10x+ slower than the
        # same run against a local database. This is a THROWAWAY CI database
        # (no durability requirement), so relax commit durability:
        # synchronous_commit is applied to existing sessions via SIGHUP —
        # no container restart needed. Production databases are unaffected.
        run: |
          npx prisma db execute --stdin <<'SQL'
          ALTER SYSTEM SET synchronous_commit = off;
          SELECT pg_reload_conf();
          SQL

      - name: Run tests
        # DB-backed suites share one disposable database and truncate between
        # tests, so Jest must remain serial. The application bootstrap also
        # leaves Prisma/pg handles open, hence forceExit.
        # Retry once only to absorb a transient CI database/runner timeout;
        # genuine test failures must reproduce and still fail the job.
        run: |
          set +e
          npm test -- --runInBand --forceExit
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::Test suite failed on first attempt — retrying once for transient CI-environment failures."
            npm test -- --runInBand --forceExit
            code=$?
          fi
          exit $code

      - name: Verify route registry against frontend API usage
        run: npm run route-check

      - name: Database backup and restore drill
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          BACKUP_DRILL_ALLOW_MUTATION: '1'
        run: npm run db:recovery-drill
