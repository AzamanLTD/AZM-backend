name: Route Checker
on:
  pull_request:
    paths:
      - 'AZM-businessPortal/src/lib/*Api*.js'
      - 'AZM-businessPortal/src/lib/api.js'
      - 'AZM-backend/routes/*.js'
      - 'AZM-backend/server.js'
      - 'AZM-backend/scripts/route-checker.js'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd AZM-backend && node scripts/route-checker.js
