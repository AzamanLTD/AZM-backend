name: _apply-liquidation-audit-patch

on:
  push:
    branches: [fix/liquidation-audit-atomicity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          finance = Path('services/finance.service.js')
          text = finance.read_text()
          old = "const { AZM_SPEND_SOURCES } = require('./azmSpendService');\n"
          new = old + "const { audit } = require('../utils/audit');\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('finance import anchor not found')
              text = text.replace(old, new, 1)

          old_sig = "const liquidateProfits = async (prisma, amountFloat, adminId) => {"
          new_sig = "const liquidateProfits = async (prisma, amountFloat, adminId, auditContext = {}) => {"
          if new_sig not in text:
              if old_sig not in text:
                  raise SystemExit('finance signature anchor not found')
              text = text.replace(old_sig, new_sig, 1)

          old_log = "        const profitLog = await tx.adminProfitLog.create({ data: { amountUsdc: amountFloat, source: 'ARBITRAGE_SPREAD', relatedTxId: `liquidation_admin_${adminId}_${Date.now()}` } });\n"
          new_log = "        const profitLog = await tx.adminProfitLog.create({ data: { amountUsdc: amountFloat, source: 'ARBITRAGE_SPREAD', relatedTxId: `liquidation_admin_${adminId}_${Date.now()}` } });\n\n        await audit(tx, {\n            actorId: auditContext.actorId ?? adminId,\n            actorName: auditContext.actorName || null,\n            action: 'LIQUIDATE_PROFITS',\n            targetType: 'SYSTEM',\n            targetId: null,\n            metadata: {\n                amountUsdc: amountFloat,\n                amountLiquidated: amountFloat,\n                relatedTxId: profitLog.relatedTxId\n            },\n            ipAddress: auditContext.ipAddress || null,\n        }, { throwOnError: true });\n"
          if new_log not in text:
              if old_log not in text:
                  raise SystemExit('finance profit log anchor not found')
              text = text.replace(old_log, new_log, 1)
          finance.write_text(text)

          controller = Path('controllers/adminController.js')
          text = controller.read_text()
          old_call = "        const data = await financeService.liquidateProfits(\n            prisma,\n            parseFloat(amountUsdc),\n            req.user.id\n        );"
          new_call = "        const data = await financeService.liquidateProfits(\n            prisma,\n            parseFloat(amountUsdc),\n            req.user.id,\n            { actorId: req.user.id, actorName: req.user.username, ipAddress: req.ip }\n        );"
          if new_call not in text:
              if old_call not in text:
                  raise SystemExit('controller liquidation call anchor not found')
              text = text.replace(old_call, new_call, 1)

          old_audit = "        // Append-only audit trail (fire-and-forget — never fails the request).\n        await audit(prisma, {\n            actorId: req.user.id, actorName: req.user.username,\n            action: 'LIQUIDATE_PROFITS', targetType: 'SYSTEM', targetId: null,\n            metadata: { amountUsdc: amountUsdc || null, amountLiquidated: data.amountLiquidated },\n            ipAddress: req.ip,\n        });\n\n"
          if old_audit in text:
              text = text.replace(old_audit, '', 1)
          controller.write_text(text)
          PY

      - name: Add real-Postgres regression suite
        shell: bash
        run: |
          set -euo pipefail
          cat > __tests__/finance-profit-liquidation-audit-atomicity.test.js <<'EOF'
          const hasDb = !!process.env.TEST_DATABASE_URL;
          const describeOrSkip = hasDb ? describe : describe.skip;
          if (!hasDb) console.warn('[finance-profit-liquidation-audit-atomicity] TEST_DATABASE_URL not set — skipping.');

          describeOrSkip('profit liquidation audit atomicity (real PostgreSQL)', () => {
              let prisma, financeService, adminId;

              beforeAll(async () => {
                  process.env.DATABASE_URL = process.env.TEST_DATABASE_URL;
                  process.env.NODE_ENV = 'test';
                  const { PrismaClient } = require('@prisma/client');
                  prisma = new PrismaClient();
                  financeService = require('../services/finance.service');
                  const admin = await prisma.user.create({
                      data: { username: `liq_admin_${Date.now()}`, email: `liq_admin_${Date.now()}@test.local`, role: 'ADMIN' }
                  });
                  adminId = admin.id;
              });

              beforeEach(async () => {
                  await prisma.auditLog.deleteMany();
                  await prisma.adminProfitLog.deleteMany();
                  await prisma.systemProfitFees.deleteMany();
                  await prisma.systemFiatPool.deleteMany();
                  await prisma.systemProfitFees.create({ data: { id: 1, balance: 100 } });
                  await prisma.systemFiatPool.create({ data: { id: 1, balance: 10 } });
              });

              afterEach(async () => {
                  await prisma.auditLog.deleteMany();
                  await prisma.adminProfitLog.deleteMany();
                  await prisma.systemProfitFees.deleteMany();
                  await prisma.systemFiatPool.deleteMany();
                  await prisma.$executeRawUnsafe('DROP TRIGGER IF EXISTS _azm_fail_liquidation_audit ON "AuditLog"');
                  await prisma.$executeRawUnsafe('DROP FUNCTION IF EXISTS _azm_fail_liquidation_audit()');
              });

              afterAll(async () => {
                  if (prisma) {
                      await prisma.auditLog.deleteMany({ where: { actorId: adminId } });
                      await prisma.user.delete({ where: { id: adminId } }).catch(() => {});
                      await prisma.$disconnect();
                  }
              });

              const balances = async () => {
                  const [profit, fiat] = await Promise.all([
                      prisma.systemProfitFees.findUnique({ where: { id: 1 } }),
                      prisma.systemFiatPool.findUnique({ where: { id: 1 } }),
                  ]);
                  return { profit: Number(profit.balance), fiat: Number(fiat.balance) };
              };

              const auditContext = {
                  actorId: () => adminId,
                  actorName: 'Liquidation Admin',
                  ipAddress: '127.0.0.1',
              };

              test('successful liquidation commits exactly one financial log and one audit row', async () => {
                  const result = await financeService.liquidateProfits(prisma, 25, adminId, {
                      actorId: auditContext.actorId(), actorName: auditContext.actorName, ipAddress: auditContext.ipAddress
                  });

                  const state = await balances();
                  expect(state.profit).toBeCloseTo(75, 6);
                  expect(state.fiat).toBeCloseTo(35, 6);
                  expect(result.amountLiquidated).toBe(25);

                  const logs = await prisma.adminProfitLog.findMany({ where: { source: 'ARBITRAGE_SPREAD' } });
                  const audits = await prisma.auditLog.findMany({ where: { action: 'LIQUIDATE_PROFITS', actorId: adminId } });
                  expect(logs).toHaveLength(1);
                  expect(Number(logs[0].amountUsdc)).toBeCloseTo(25, 6);
                  expect(audits).toHaveLength(1);
                  expect(audits[0].actorName).toBe('Liquidation Admin');
                  expect(audits[0].targetType).toBe('SYSTEM');
                  expect(audits[0].metadata).toEqual(expect.objectContaining({ amountUsdc: 25, amountLiquidated: 25, relatedTxId: logs[0].relatedTxId }));
                  expect(audits[0].ipAddress).toBe('127.0.0.1');
              });

              test('audit failure rolls back profit debit, fiat credit, and AdminProfitLog', async () => {
                  await prisma.$executeRawUnsafe(`
                      CREATE OR REPLACE FUNCTION _azm_fail_liquidation_audit() RETURNS trigger AS
                      $$ BEGIN RAISE EXCEPTION 'forced liquidation audit failure'; END $$ LANGUAGE plpgsql;
                  `);
                  await prisma.$executeRawUnsafe(
                      'CREATE TRIGGER _azm_fail_liquidation_audit BEFORE INSERT ON "AuditLog" FOR EACH ROW EXECUTE FUNCTION _azm_fail_liquidation_audit()'
                  );

                  await expect(financeService.liquidateProfits(prisma, 25, adminId, {
                      actorId: adminId, actorName: auditContext.actorName, ipAddress: auditContext.ipAddress
                  })).rejects.toThrow('forced liquidation audit failure');

                  const state = await balances();
                  expect(state.profit).toBeCloseTo(100, 6);
                  expect(state.fiat).toBeCloseTo(10, 6);
                  expect(await prisma.adminProfitLog.count()).toBe(0);
                  expect(await prisma.auditLog.count({ where: { action: 'LIQUIDATE_PROFITS' } })).toBe(0);
              });

              test('concurrent liquidations are still one-winner and each committed liquidation has one audit', async () => {
                  const call = () => financeService.liquidateProfits(prisma, 60, adminId, {
                      actorId: adminId, actorName: auditContext.actorName, ipAddress: auditContext.ipAddress
                  }).then(() => ({ ok: true })).catch((error) => ({ ok: false, error }));

                  const outcomes = await Promise.all([call(), call()]);
                  expect(outcomes.filter((o) => o.ok)).toHaveLength(1);
                  expect(outcomes.filter((o) => !o.ok && o.error?.code === 'INSUFFICIENT_PROFIT_BALANCE')).toHaveLength(1);

                  const state = await balances();
                  expect(state.profit).toBeCloseTo(40, 6);
                  expect(state.fiat).toBeCloseTo(70, 6);
                  expect(await prisma.adminProfitLog.count({ where: { source: 'ARBITRAGE_SPREAD' } })).toBe(1);
                  expect(await prisma.auditLog.count({ where: { action: 'LIQUIDATE_PROFITS', actorId: adminId } })).toBe(1);
              });
          });
          EOF

      - name: Commit patch and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_apply_liquidation_audit_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/finance.service.js controllers/adminController.js __tests__/finance-profit-liquidation-audit-atomicity.test.js .github/workflows/_apply_liquidation_audit_patch.yml
          git commit -m 'fix(finance): make profit liquidation audit atomic'
          git push origin HEAD:${GITHUB_REF_NAME}
