name: Transit scope wiring
on:
  push:
    branches: [fix/transit-ops-business-scope]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped transit calls
        env:
          BRANCH: fix/transit-ops-business-scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/businessOSRoutes.js')
          s = p.read_text()
          replacements = {
              "const svc = getServices(req);\n    const assignment = await svc.transitOpsService.updateAssignmentStatus(req.params.id, req.body.status);": "const svc = getServices(req);\n    const bpId = await getBusinessProfileId(req);\n    const assignment = await svc.transitOpsService.updateAssignmentStatus(req.params.id, req.body.status, bpId);",
              "const svc = getServices(req);\n    const record = await svc.transitOpsService.updateMaintenanceStatus(req.params.id, req.body);": "const svc = getServices(req);\n    const bpId = await getBusinessProfileId(req);\n    const record = await svc.transitOpsService.updateMaintenanceStatus(req.params.id, req.body, bpId);",
              "const svc = getServices(req);\n    const manifest = await svc.transitOpsService.getTripManifest(req.params.tripId);": "const svc = getServices(req);\n    const bpId = await getBusinessProfileId(req);\n    const manifest = await svc.transitOpsService.getTripManifest(req.params.tripId, bpId);",
              "const svc = getServices(req);\n    const result = await svc.transitOpsService.boardPassenger(req.body.reservationId);": "const svc = getServices(req);\n    const bpId = await getBusinessProfileId(req);\n    const result = await svc.transitOpsService.boardPassenger(req.body.reservationId, bpId);",
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              print('No route changes needed')
              raise SystemExit(0)
          p.write_text(s)
          PY
          git config user.name 'azaman-ci'
          git config user.email 'azaman-ci@users.noreply.github.com'
          git add routes/businessOSRoutes.js
          git commit -m 'fix(transit): pass business scope through ops routes'
          git push --force-with-lease origin "$BRANCH"
