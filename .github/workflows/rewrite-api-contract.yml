name: Rewrite API contract
on:
  push:
    branches:
      - docs/currency-and-fiat-lifecycle-contract-v2
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api_contract.md')
          s=p.read_text()
          replacements={
          '''- **Currencies**: Internal balances are USDC. GHS values displayed to users\n  are computed as `availableBalance × GlobalSettings.liveUsdToGhs` ("the\n  Hologram"). The backend never persists GHS as a balance.''':'''- **Currencies**: Internal balances are USDC. GHS values displayed to users\n  are computed from the canonical `USDC/GHS` retail oracle snapshot, using\n  `availableBalance × GlobalSettings.liveRetailRate` ("the Hologram"). The\n  backend never persists GHS as a balance. Legacy `liveUsdToGhs` values are\n  compatibility metadata and are not the canonical user-facing rate.''',
          '''Returns the live oracle rates: `{ liveUsdToGhs, bankMargin, thirdPartyMargin }`.''':'''Returns the live oracle snapshot, including the canonical `USDC/GHS`\nretail rate (`liveRetailRate`), settlement/display currency metadata, source,\nand freshness information. `liveUsdToGhs` is legacy compatibility metadata.''',
          '''- Writes `TransactionHistory(WITHDRAWAL_FIAT, COMPLETED, txHash =\n  X-Reference-Id)`.''':'''- Creates the fiat withdrawal transaction in `PENDING` while the external\n  provider is settling. Provider `SUCCESS` atomically transitions it to\n  `COMPLETED`; provider `FAILED` reverses only a still-PENDING reservation.''',
          '''    "transaction":        { "id": ..., "status": "COMPLETED", "txHash": "<uuid-v4>" },''':'''    "transaction":        { "id": ..., "status": "PENDING", "txHash": "<uuid-v4>" },'''
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected contract text: {old[:80]!r}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit contract and remove workflow
        shell: bash
        run: |
          rm .github/workflows/rewrite-api-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api_contract.md .github/workflows/rewrite-api-contract.yml
          git commit -m 'docs: align API contract with canonical currency lifecycle'
          git push
