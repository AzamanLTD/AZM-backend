name: Storefront CAS Migration

on:
  push:
    branches:
      - fix/storefront-draft-save-cas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch saveDraft with compare-and-swap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/storefrontService.js')
          s = p.read_text()
          old = """async function saveDraft(prisma, businessProfileId, layoutJson, themeId, expectedUpdatedAt) {
            // Optimistic concurrency: reject if draft changed since client loaded it
            if (expectedUpdatedAt) {
              const existing = await prisma.businessStorefrontLayout.findUnique({
                where: { businessProfileId_status: { businessProfileId, status: 'DRAFT' } },
              });
              if (existing && existing.updatedAt.toISOString() !== expectedUpdatedAt) {
                throw new Error('Draft was modified by another editor. Please refresh.');
              }
            }

            const migratedLayout = migrateLayout(layoutJson);
            validateStudioExperience(migratedLayout);

            const draft = await prisma.businessStorefrontLayout.upsert({
              where: { businessProfileId_status: { businessProfileId, status: 'DRAFT' } },
              create: {
                businessProfileId,
                status: 'DRAFT',
                themeId,
                layoutJson: migratedLayout,
              },
              update: {
                themeId,
                layoutJson: migratedLayout,
              },
              include: { theme: true },
            });

            return draft;
          }"""
          new = """async function saveDraft(prisma, businessProfileId, layoutJson, themeId, expectedUpdatedAt) {
            const migratedLayout = migrateLayout(layoutJson);
            validateStudioExperience(migratedLayout);

            const staleDraftError = () => new Error('Draft was modified by another editor. Please refresh.');

            if (!expectedUpdatedAt) {
              return prisma.businessStorefrontLayout.upsert({
                where: { businessProfileId_status: { businessProfileId, status: 'DRAFT' } },
                create: {
                  businessProfileId,
                  status: 'DRAFT',
                  themeId,
                  layoutJson: migratedLayout,
                },
                update: {
                  themeId,
                  layoutJson: migratedLayout,
                },
                include: { theme: true },
              });
            }

            const expectedDate = new Date(expectedUpdatedAt);
            if (Number.isNaN(expectedDate.getTime())) {
              throw staleDraftError();
            }

            const existing = await prisma.businessStorefrontLayout.findUnique({
              where: { businessProfileId_status: { businessProfileId, status: 'DRAFT' } },
            });

            if (!existing) {
              try {
                return await prisma.businessStorefrontLayout.create({
                  data: {
                    businessProfileId,
                    status: 'DRAFT',
                    themeId,
                    layoutJson: migratedLayout,
                  },
                  include: { theme: true },
                });
              } catch (error) {
                if (error?.code === 'P2002') throw staleDraftError();
                throw error;
              }
            }

            const claim = await prisma.businessStorefrontLayout.updateMany({
              where: {
                id: existing.id,
                businessProfileId,
                status: 'DRAFT',
                updatedAt: expectedDate,
              },
              data: {
                themeId,
                layoutJson: migratedLayout,
              },
            });

            if (claim.count !== 1) throw staleDraftError();

            return prisma.businessStorefrontLayout.findUnique({
              where: { id: existing.id },
              include: { theme: true },
            });
          }"""
          if old not in s:
              raise SystemExit('saveDraft target block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add compare-and-swap regression tests
        shell: bash
        run: |
          cat > __tests__/storefrontService-draft-cas.test.js <<'EOF'
          jest.mock('../services/storefrontSchemaMigration', () => ({
            migrateLayout: (layout) => layout,
            generateEmptyLayout: () => ({}),
          }));

          const { saveDraft } = require('../services/storefrontService');

          const layout = { experience: { schemaVersion: 2, pages: [{ id: 'home', root: [] }], nodes: {} } };

          describe('Storefront draft compare-and-swap', () => {
            test('updates only when the observed timestamp still matches', async () => {
              const findUnique = jest.fn();
              const updateMany = jest.fn().mockResolvedValue({ count: 1 });
              const readBack = { id: 'draft-1', theme: { key: 'classic_light' } };
              findUnique
                .mockResolvedValueOnce({
                  id: 'draft-1',
                  businessProfileId: 'business-1',
                  status: 'DRAFT',
                  updatedAt: new Date('2026-09-04T18:00:00.000Z'),
                })
                .mockResolvedValueOnce(readBack);
              const prisma = { businessStorefrontLayout: { findUnique, updateMany } };

              await expect(saveDraft(prisma, 'business-1', layout, 'theme-1', '2026-09-04T18:00:00.000Z'))
                .resolves.toEqual(readBack);
              expect(updateMany).toHaveBeenCalledWith(expect.objectContaining({
                where: expect.objectContaining({ id: 'draft-1', updatedAt: new Date('2026-09-04T18:00:00.000Z') }),
              }));
            });

            test('rejects when compare-and-swap loses the race', async () => {
              const prisma = {
                businessStorefrontLayout: {
                  findUnique: jest.fn().mockResolvedValue({
                    id: 'draft-1',
                    businessProfileId: 'business-1',
                    status: 'DRAFT',
                    updatedAt: new Date('2026-09-04T18:00:00.000Z'),
                  }),
                  updateMany: jest.fn().mockResolvedValue({ count: 0 }),
                },
              };

              await expect(saveDraft(prisma, 'business-1', layout, 'theme-1', '2026-09-04T18:00:00.000Z'))
                .rejects.toThrow('Draft was modified by another editor. Please refresh.');
            });

            test('invalid expected timestamp fails closed', async () => {
              const prisma = { businessStorefrontLayout: { findUnique: jest.fn() } };
              await expect(saveDraft(prisma, 'business-1', layout, 'theme-1', 'not-a-date'))
                .rejects.toThrow('Draft was modified by another editor. Please refresh.');
              expect(prisma.businessStorefrontLayout.findUnique).not.toHaveBeenCalled();
            });

            test('a concurrent first writer makes the expected-version create stale', async () => {
              const prisma = {
                businessStorefrontLayout: {
                  findUnique: jest.fn().mockResolvedValue(null),
                  create: jest.fn().mockRejectedValue({ code: 'P2002' }),
                },
              };
              await expect(saveDraft(prisma, 'business-1', layout, 'theme-1', '2026-09-04T18:00:00.000Z'))
                .rejects.toThrow('Draft was modified by another editor. Please refresh.');
            });
          });
          EOF

      - name: Verify targeted tests
        shell: bash
        run: |
          npm test -- --runInBand __tests__/storefrontService-draft-cas.test.js

      - name: Commit patch and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/storefrontService.js __tests__/storefrontService-draft-cas.test.js
          git rm .github/workflows/studio-cas-migration.yml
          git commit -m "fix(storefront): make draft saves compare-and-swap safe"
          git push origin HEAD:${{ github.ref_name }}
