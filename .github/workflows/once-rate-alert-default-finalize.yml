name: Finalize RateAlert canonical default

on:
  push:
    branches:
      - fix/rate-alert-db-default-mainline

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical schema default and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          pattern = r'(model\s+RateAlert\s*\{.*?\n\s*ratePair\s+String\s+@default\(")USD_GHS("\))'
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('Could not locate RateAlert.ratePair default in the real main schema.')
          s = s[:m.start(1)] + m.group(1).replace('USD_GHS', 'USDC_GHS') + m.group(2) + s[m.end(2):]
          p.write_text(s)
          mig = Path('prisma/migrations/20260904130000_rate_alert_canonical_pair')
          mig.mkdir(parents=True, exist_ok=True)
          (mig / 'migration.sql').write_text('ALTER TABLE "RateAlert"\n  ALTER COLUMN "ratePair" SET DEFAULT \'USDC_GHS\';\n')
          test = Path('__tests__/rate-alert-db-default.current.test.js')
          test.write_text("""const fs = require('fs');\nconst path = require('path');\n\ndescribe('RateAlert canonical pair migration', () => {\n  const migration = fs.readFileSync(\n    path.join(__dirname, '..', 'prisma', 'migrations', '20260904130000_rate_alert_canonical_pair', 'migration.sql'),\n    'utf8',\n  );\n\n  test('changes only the database default to USDC_GHS', () => {\n    expect(migration.trim()).toBe(\n      'ALTER TABLE \\\"RateAlert\\\"\\n  ALTER COLUMN \\\"ratePair\\\" SET DEFAULT \\\'USDC_GHS\\\';',\n    );\n  });\n});\n""")
          workflow = Path('.github/workflows/once-rate-alert-default-finalize.yml')
          workflow.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma prisma/migrations/20260904130000_rate_alert_canonical_pair/migration.sql __tests__/rate-alert-db-default.current.test.js .github/workflows/once-rate-alert-default-finalize.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(rate-alerts): make USDC_GHS the database default'
          git push origin HEAD:fix/rate-alert-db-default-mainline
