# §WP-H §8 — the reproducible full-suite stack, executed on a real Docker host.
# Manual, plus a narrow path trigger so a change to the stack itself is proved
# rather than merged on inspection alone.
name: Docker full suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'scripts/test-full.sh'
      - 'scripts/gen-test-tls.sh'
      - 'docs/DEPLOYMENT_PREREQUISITES.md'
      - '.github/workflows/docker-test-full.yml'

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show compose version
        run: docker compose version
      - name: Run the complete suite against disposable services
        run: make test-full
      - name: Always tear the stack down
        if: always()
        run: docker compose --profile tls --profile api down -v --remove-orphans || true
