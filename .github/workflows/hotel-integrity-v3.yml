name: Hotel integrity v3

on:
  push:
    branches: [fix/hotel-ops-business-scope-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hotel-ops-business-scope-v2
          fetch-depth: 1
      - name: Apply atomicity and bulk validation hardening
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/businessOS/hotelOpsService.js')
          s = p.read_text()
          old = '''    const reservation = await this.prisma.reservation.create({\n        data: {\n            businessProfileId,\n            serviceItemId: roomId,\n            customerId,\n            notes: `Phone: ${phone || 'N/A'}. ${notes || ''}`.trim(),\n            status: 'CHECKED_IN',\n            startDatetime,\n            endDatetime,\n            depositUsdc: depositUsdc ? parseFloat(depositUsdc) : null,\n            amountUsdc: Number(room.basePriceUsdc) * Math.max(1, parseInt(nights) || 1),\n            metadata: { channel: 'FRONT_DESK', phone },\n        },\n    });\n\n    await this.prisma.hotelRoom.update({\n        where: { id: roomId },\n        data: {\n            status: 'OCCUPIED',\n            currentReservationId: reservation.id,\n            checkedInAt: new Date(),\n            checkoutDueAt: endDatetime,\n        },\n    });\n\n    return reservation;'''
          new = '''    return this.prisma.$transaction(async (tx) => {\n        const reservation = await tx.reservation.create({\n            data: {\n                businessProfileId,\n                serviceItemId: roomId,\n                customerId,\n                notes: `Phone: ${phone || 'N/A'}. ${notes || ''}`.trim(),\n                status: 'CHECKED_IN',\n                startDatetime,\n                endDatetime,\n                depositUsdc: depositUsdc ? parseFloat(depositUsdc) : null,\n                amountUsdc: Number(room.basePriceUsdc) * Math.max(1, parseInt(nights) || 1),\n                metadata: { channel: 'FRONT_DESK', phone },\n            },\n        });\n\n        await tx.hotelRoom.update({\n            where: { id: roomId },\n            data: {\n                status: 'OCCUPIED',\n                currentReservationId: reservation.id,\n                checkedInAt: new Date(),\n                checkoutDueAt: endDatetime,\n            },\n        });\n\n        return reservation;\n    });'''
          if old not in s: raise SystemExit('missing walk-in atomicity block')
          s = s.replace(old, new, 1)

          old = '''HotelOpsService.prototype.bulkCreateRooms = async function(businessProfileId, { startNumber, endNumber, roomType, floor, basePrice, weekendPrice, capacity, locationId }) {\n    const rooms = [];\n    const start = parseInt(startNumber);\n    const end = parseInt(endNumber);\n    for (let n = start; n <= end; n++) {'''
          new = '''HotelOpsService.prototype.bulkCreateRooms = async function(businessProfileId, { startNumber, endNumber, roomType, floor, basePrice, weekendPrice, capacity, locationId }) {\n    if (!businessProfileId) throw new Error('Business profile context is required.');\n    const start = Number.parseInt(startNumber, 10);\n    const end = Number.parseInt(endNumber, 10);\n    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start) {\n        throw new Error('A valid room number range is required.');\n    }\n    if (end - start + 1 > 500) {\n        throw new Error('Bulk room creation is limited to 500 rooms at a time.');\n    }\n    if (locationId) {\n        const location = await this.prisma.businessLocation.findFirst({\n            where: { id: locationId, businessProfileId },\n            select: { id: true },\n        });\n        if (!location) throw new Error('Location not found for this business.');\n    }\n    const rooms = [];\n    for (let n = start; n <= end; n++) {'''
          if old not in s: raise SystemExit('missing bulk room block')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('__tests__/hotelOpsService.business-scope.test.js')
          s = p.read_text()
          insert = '''\n    test('rejects bulk room ranges larger than 500 rooms', async () => {\n        const prisma = { businessLocation: { findFirst: jest.fn() }, hotelRoom: { createMany: jest.fn() } };\n        const svc = new HotelOpsService(prisma);\n        await expect(svc.bulkCreateRooms(bpA, { startNumber: 1, endNumber: 501 })).rejects.toThrow('limited to 500');\n        expect(prisma.hotelRoom.createMany).not.toHaveBeenCalled();\n    });\n\n    test('rejects bulk room creation with a foreign location', async () => {\n        const prisma = { businessLocation: { findFirst: jest.fn().mockResolvedValue(null) }, hotelRoom: { createMany: jest.fn() } };\n        const svc = new HotelOpsService(prisma);\n        await expect(svc.bulkCreateRooms(bpA, { startNumber: 1, endNumber: 2, locationId: 'location-b' })).rejects.toThrow('Location not found for this business.');\n        expect(prisma.hotelRoom.createMany).not.toHaveBeenCalled();\n    });\n\n    test('rolls back a walk-in reservation when room occupancy update fails', async () => {\n        const tx = {\n            reservation: { create: jest.fn().mockResolvedValue({ id: 'reservation-a' }) },\n            hotelRoom: { update: jest.fn().mockRejectedValue(new Error('room update failed')) },\n        };\n        const prisma = {\n            hotelRoom: { findFirst: jest.fn().mockResolvedValue({ id: 'room-a', status: 'AVAILABLE', basePriceUsdc: 100 }) },\n            user: { findUnique: jest.fn().mockResolvedValue({ id: 42 }) },\n            $transaction: jest.fn(async callback => callback(tx)),\n        };\n        const svc = new HotelOpsService(prisma);\n        await expect(svc.createWalkIn(bpA, { customerId: 42, roomId: 'room-a', nights: 1 })).rejects.toThrow('room update failed');\n        expect(prisma.$transaction).toHaveBeenCalledTimes(1);\n        expect(tx.reservation.create).toHaveBeenCalledTimes(1);\n    });\n'''
          marker = "    test('rejects room moves across business boundaries', async () => {"
          if marker not in s: raise SystemExit('missing hotel test marker')
          s = s.replace(marker, insert + '\n' + marker, 1)
          p.write_text(s)

          Path('.github/workflows/hotel-integrity-v3.yml').unlink()
          import subprocess
          subprocess.run(['git','config','user.name','azaman-automation'], check=True)
          subprocess.run(['git','config','user.email','automation@azaman.local'], check=True)
          subprocess.run(['git','add','services/businessOS/hotelOpsService.js','__tests__/hotelOpsService.business-scope.test.js','.github/workflows/hotel-integrity-v3.yml'], check=True)
          subprocess.run(['git','commit','-m','fix(hotel): make walk-ins atomic and bound bulk room creation'], check=True)
          subprocess.run(['git','push','origin','HEAD:fix/hotel-ops-business-scope-v2'], check=True)
          PY
