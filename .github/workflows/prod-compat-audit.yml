name: Production branch compatibility audit (read-only, one-time)
on:
  push:
    branches:
      - prod-audit
permissions:
  contents: read
jobs:
  audit:
    name: Read-only schema compatibility audit (both eu-west-2 endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.AUDIT_RENDER_RUNTIME_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Run audit (structural metadata and counts only)
        run: |
          pip install -q psycopg2-binary
          python3 - <<'PY'
          import os, re, psycopg2

          def audit(label, url):
              print(f'\n########## AUDIT TARGET: {label} ##########')
              conn = psycopg2.connect(url, connect_timeout=15)
              cur = conn.cursor()
              def sql(q):
                  cur.execute(q); row = cur.fetchone()
                  return row[0] if row else None
              print('current_database():', sql('SELECT current_database()'))
              host = re.search(r'@([a-z0-9.-]+)', url).group(1)
              print('host:', host)

              if sql("SELECT to_regclass('\"IdempotencyKey\"') IS NULL") is False:
                  cur.execute('SELECT count(*) FROM \"IdempotencyKey\"')
                  print('IdempotencyKey: EXISTS, row count:', cur.fetchone()[0])
              else:
                  print('IdempotencyKey: ABSENT')

              schema = open('prisma/schema.prisma').read()
              model_names = set(re.findall(r'^model (\w+)', schema, re.M))
              req = {}
              for m in re.finditer(r'^model (\w+) \{(.*?)^\}', schema, re.M | re.S):
                  name, body = m.group(1), m.group(2)
                  tm = re.search(r'@@map\("([^"]+)"\)', body)
                  table = tm.group(1) if tm else name
                  cols = set()
                  for line in body.splitlines():
                      line = line.strip()
                      if not line or line.startswith('//') or line.startswith('@@'): continue
                      fm = re.match(r'(\w+)\s+([\w\[\]]+)', line)
                      if not fm: continue
                      fld, typ = fm.group(1), fm.group(2)
                      if typ.rstrip('?').rstrip('[]') in model_names: continue
                      cm = re.search(r'@map\("([^"]+)"\)', line)
                      cols.add(cm.group(1) if cm else fld)
                  req[table] = cols

              cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public'")
              have = {r[0] for r in cur.fetchall()}
              missing_tables = sorted(t for t in req if t not in have)
              print('\nprisma tables MISSING (%d):' % len(missing_tables))
              for t in missing_tables: print('  -', t)

              print('\nexisting prisma tables with missing columns:')
              cur.execute("SELECT table_name, column_name FROM information_schema.columns WHERE table_schema='public'")
              dbcols = {(r[0], r[1]) for r in cur.fetchall()}
              ncol = 0
              for t, cols in req.items():
                  if t in missing_tables: continue
                  miss = sorted(c for c in cols if (t, c) not in dbcols)
                  if miss:
                      ncol += 1
                      print(f'  {t}: missing {miss}')
              if ncol == 0: print('  NONE')
              conn.close()
              return missing_tables

          base = os.environ['DB_URL']
          current = base.replace('-pooler.', '.')   # small-butterfly direct
          prod   = base.replace('ep-small-butterfly-abxfnkn5.', 'ep-crimson-cell-ab81e3bp.')
          for u in (current, prod):
              h = re.search(r'@([a-z0-9.-]+)', u).group(1)
              assert h in ('ep-small-butterfly-abxfnkn5.eu-west-2.aws.neon.tech',
                           'ep-crimson-cell-ab81e3bp.eu-west-2.aws.neon.tech'), h
          miss_current = audit('CURRENT prod DB (small-butterfly, direct)', current)
          miss_prod    = audit('ORIGINAL prod branch (ep-crimson-cell, direct)', prod)
          print('\n########## DELTA ##########')
          print('missing on current but PRESENT on original branch:', sorted(set(miss_current) - set(miss_prod)) or 'NONE')
          print('missing on original branch but PRESENT on current:', sorted(set(miss_prod) - set(miss_current)) or 'NONE')
          print('missing on BOTH:', sorted(set(miss_prod) & set(miss_current)) or 'NONE')
          print('\nAUDIT COMPLETE')
          PY
