name: Audit DB read-only comparison

# STRICTLY READ-ONLY audit: counts and table presence only. No row contents,
# no credentials, no DDL, no writes. Each connection runs every query inside a
# BEGIN READ ONLY transaction and always rolls back.
on:
  push:
    branches: [audit/db-readonly-comparison]

permissions:
  contents: read

jobs:
  compare:
    name: Read-only counts (Azaman-New vs current Render runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZAMAN_NEW_URL: ${{ secrets.AZM_NEW_DATABASE_URL }}
      RENDER_RUNTIME_URL: ${{ secrets.AUDIT_RENDER_RUNTIME_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pg driver only
        run: npm install pg --no-save --silent
      - name: Read-only date ranges and pooled-endpoint check
        run: |
          node <<'AUDIT2'
          const { Client } = require('pg');
          const assert = (c, m) => { if (!c) throw new Error('GUARD FAILED: ' + m); };
          async function ranges(raw, label, poolCheck) {
            const u = new URL(raw); const host = u.hostname.toLowerCase();
            assert(host.endsWith('.neon.tech'), label + ': not a Neon host');
            const c = new Client({ connectionString: raw, ssl: { rejectUnauthorized: false } });
            await c.connect();
            await c.query('BEGIN READ ONLY');
            console.log(`\n### ${label}: ${host} / ${ (await c.query('SELECT current_database() AS db')).rows[0].db }`);
            // created-date ranges for tables holding data (no row contents)
            const tables = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name");
            for (const r of tables.rows) {
              const cols = await c.query("SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name=$1 AND column_name IN ('createdAt','created_at')", [r.table_name]);
              if (!cols.rows.length) continue;
              const col = cols.rows[0].column_name;
              const m = await c.query(`SELECT count(*)::int n, min("${col}")::date dmin, max("${col}")::date dmax FROM "public"."${r.table_name}"`);
              if (m.rows[0].n > 0) console.log(`  ${r.table_name}: ${m.rows[0].n} rows, created ${m.rows[0].dmin} .. ${m.rows[0].dmax}`);
            }
            // User email-domain aggregate only (no local parts)
            const uq = await c.query("SELECT split_part(email, '@', 2) AS dom, count(*)::int n, min(\"createdAt\")::date dmin, max(\"createdAt\")::date dmax FROM \"public\".\"User\" GROUP BY 1 ORDER BY 2 DESC");
            for (const x of uq.rows) console.log(`  User domain ${x.dom}: ${x.n} rows, created ${x.dmin} .. ${x.dmax}`);
            await c.query('ROLLBACK');
            await c.end();
            if (poolCheck) {
              // swap the direct endpoint for the project's pooled runtime endpoint
              const poolHost = host.replace(/^ep-([a-z0-9-]+)\./, 'ep-$1-pooler.');
              u.hostname = poolHost;
              const pc = new Client({ connectionString: u.toString(), ssl: { rejectUnauthorized: false } });
              await pc.connect();
              const r = await pc.query('SELECT current_database() AS db');
              console.log(`  POOLED ENDPOINT OK: ${poolHost} -> ${r.rows[0].db}`);
              await pc.end();
            }
          }
          (async () => {
            await ranges(process.env.RENDER_RUNTIME_URL, 'CURRENT-RENDER-RUNTIME', false);
            await ranges(process.env.AZAMAN_NEW_URL, 'AZAMAN-NEW', true);
          })().catch(e => { console.error('AUDIT2 FAILED:', e.message); process.exit(1); });
          AUDIT2
      - name: Read-only schema and row-count comparison
        run: |
          node <<'AUDIT'
          const { Client } = require('pg');
          const assert = (c, m) => { if (!c) throw new Error('GUARD FAILED: ' + m); };
          const parse = (raw, label) => {
            assert(raw, label + ' secret missing');
            const u = new URL(raw);
            const host = u.hostname.toLowerCase();
            assert(host.endsWith('.neon.tech'), label + ': not a Neon host');
            return raw;
          };
          // Owner-requested data tables for the comparison
          const DATA_TABLES = ['User','BusinessProfile','BusinessProduct','CurrencyWallet',
            'TransactionHistory','Withdrawal','JournalEntry','LedgerTransaction',
            'LedgerAccount','BusinessLedgerEntry','FinancialOperation','PaymentRequest'];
          async function audit(raw, label) {
            parse(raw, label);
            const c = new Client({ connectionString: raw, ssl: { rejectUnauthorized: false } });
            await c.connect();
            await c.query('BEGIN READ ONLY');
            const ident = await c.query("SELECT current_database() AS db");
            const host = new URL(raw).hostname.toLowerCase();
            console.log(`\n=== ${label}: ${host} / ${ident.rows[0].db} ===`);
            const tot = await c.query("SELECT count(*)::int AS n FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'");
            console.log(`public base tables: ${tot.rows[0].n}`);
            // Presence + counts for the requested groups
            for (const t of DATA_TABLES) {
              const ex = await c.query("SELECT to_regclass($1) IS NOT NULL AS present", [`public."${t}"`]);
              if (!ex.rows[0].present) { console.log(`  ${t}: ABSENT`); continue; }
              const n = await c.query(`SELECT count(*)::int AS n FROM "public"."${t}"`);
              console.log(`  ${t}: present, ${n.rows[0].n} rows`);
            }
            // Any table holding data at all (data-safety sweep)
            const tables = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name");
            let nonEmpty = [];
            for (const r of tables.rows) {
              const n = await c.query(`SELECT count(*)::int AS n FROM "public"."${r.table_name}"`);
              if (n.rows[0].n > 0) nonEmpty.push(`${r.table_name}=${n.rows[0].n}`);
            }
            console.log(`  tables with rows (${nonEmpty.length}): ${nonEmpty.join(', ') || 'NONE'}`);
            await c.query('ROLLBACK');
            await c.end();
          }
          (async () => {
            await audit(process.env.RENDER_RUNTIME_URL, 'CURRENT-RENDER-RUNTIME');
            await audit(process.env.AZAMAN_NEW_URL, 'AZAMAN-NEW');
          })().catch(e => { console.error('AUDIT FAILED:', e.message); process.exit(1); });
          AUDIT
