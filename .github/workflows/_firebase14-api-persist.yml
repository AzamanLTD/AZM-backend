name: Firebase 14 dependency API persistence

on:
  push:
    branches: [chore/security-firebase14-api-persist]

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upgrade Firebase Admin
        run: npm install --save firebase-admin@14.3.0

      - name: Create final Git commit objects through GitHub API
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}"
          parent_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          create_blob() {
            local file="$1"
            jq -Rs '{content:.,encoding:"utf-8"}' < "$file" |
              curl -fsS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${API}/git/blobs" \
                -d @- | jq -er '.sha'
          }

          pkg_sha="$(create_blob package.json)"
          lock_sha="$(create_blob package-lock.json)"

          dependency_tree="$(jq -cn \
            --arg base "${base_tree}" \
            --arg pkg "${pkg_sha}" \
            --arg lock "${lock_sha}" \
            '{base_tree:$base,tree:[{path:"package.json",mode:"100644",type:"blob",sha:$pkg},{path:"package-lock.json",mode:"100644",type:"blob",sha:$lock}]}')"

          dependency_tree_sha="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/trees" \
            -d "${dependency_tree}" | jq -er '.sha')"

          dependency_commit_sha="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/commits" \
            -d "$(jq -cn --arg message 'security: upgrade Firebase Admin to 14.3.0' --arg tree "${dependency_tree_sha}" --arg parent "${parent_sha}" '{message:$message,tree:$tree,parents:[$parent]}')" | jq -er '.sha')"

          cleanup_tree="$(jq -cn \
            --arg base "$(git ls-tree -d --full-tree HEAD | awk '$4==".github" {print $3}')" \
            '{base_tree:$base,tree:[{path:"workflows/_firebase14-api-persist.yml",mode:"100644",type:"blob",sha:null}]}')"
          cleanup_tree_sha="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/trees" \
            -d "$(jq -cn --arg base "${dependency_tree_sha}" '{base_tree:$base,tree:[{path:".github/workflows/_firebase14-api-persist.yml",mode:"100644",type:"blob",sha:null}]}')" | jq -er '.sha')"

          final_commit_sha="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/commits" \
            -d "$(jq -cn --arg message 'chore(ci): remove temporary Firebase 14 persistence workflow' --arg tree "${cleanup_tree_sha}" --arg parent "${dependency_commit_sha}" '{message:$message,tree:$tree,parents:[$parent]}')" | jq -er '.sha')"

          echo "final_commit_sha=${final_commit_sha}" >> "$GITHUB_OUTPUT"
          echo "dependency_commit_sha=${dependency_commit_sha}" >> "$GITHUB_OUTPUT"
          echo "Final commit object: ${final_commit_sha}"
