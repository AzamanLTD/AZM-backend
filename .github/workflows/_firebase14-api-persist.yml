name: Firebase 14 dependency API persistence

on:
  push:
    branches: [chore/security-firebase14-api-persist]

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upgrade Firebase Admin
        run: npm install --save firebase-admin@14.3.0

      - name: Create Git commit objects through GitHub API
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}"
          parent_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          pkg_b64="$(base64 -w0 package.json)"
          lock_b64="$(base64 -w0 package-lock.json)"

          pkg_sha="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/blobs" -d "$(jq -cn --arg content "${pkg_b64}" '{content:$content,encoding:"base64"}')" | jq -r '.sha')"
          lock_sha="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/blobs" -d "$(jq -cn --arg content "${lock_b64}" '{content:$content,encoding:"base64"}')" | jq -r '.sha')"

          tree_payload="$(jq -cn \
            --arg base "${base_tree}" \
            --arg pkg "${pkg_sha}" \
            --arg lock "${lock_sha}" \
            '{base_tree:$base,tree:[{path:"package.json",mode:"100644",type:"blob",sha:$pkg},{path:"package-lock.json",mode:"100644",type:"blob",sha:$lock}]}')"

          tree_sha="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/trees" -d "${tree_payload}" | jq -r '.sha')"

          commit_sha="$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/git/commits" -d "$(jq -cn --arg message 'security: upgrade Firebase Admin to 14.3.0' --arg tree "${tree_sha}" --arg parent "${parent_sha}" '{message:$message,tree:$tree,parents:[$parent]}')" | jq -r '.sha')"

          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "Created commit object ${commit_sha} with Firebase 14 dependency state"

      - name: Remove temporary workflow from generated tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Commit object created by API; branch ref will be advanced by the external repository API after this job."
