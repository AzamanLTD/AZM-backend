name: Control Plane Repair

on:
  push:
    branches: [feat/control-plane-staff-model]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/control-plane-staff-model
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair deterministic JavaScript syntax/security defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('routes/adminControlPlaneRoutes.js')
          s = p.read_text()
          s = s.replace('current."isGlobalSuperAdmin"', 'current.isGlobalSuperAdmin')
          s = s.replace('current."userId"', 'current.userId')
          p.write_text(s)

          p = Path('services/controlPlaneService.js')
          s = p.read_text()
          s = s.replace("  if (adminType === 'SUPER_ADMIN') return true;", "  if (adminType === 'SUPER_ADMIN' && staff.isGlobalSuperAdmin) return true;")
          p.write_text(s)
          PY

      - name: Syntax check
        run: |
          node --check routes/adminControlPlaneRoutes.js
          node --check services/controlPlaneService.js

      - name: Commit repaired files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/adminControlPlaneRoutes.js services/controlPlaneService.js
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'fix(control-plane): repair route syntax and authority boundary'
          git push origin HEAD:feat/control-plane-staff-model

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/control-plane-repair.yml
          git commit -m 'chore(ci): remove temporary control-plane repair workflow'
          git push origin HEAD:feat/control-plane-staff-model
