name: Hotel v3 sync

on:
  push:
    branches: [fix/hotel-ops-business-scope-v2]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/hotel-ops-business-scope-v2
      - name: Merge current main
        run: |
          set -e
          git config user.name azaman-ci
          git config user.email azaman-ci@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/hotel-v3-sync.yml
          git add -A
          git commit -m 'chore(hotel): sync branch with current main'
          git push origin HEAD:fix/hotel-ops-business-scope-v2
